name: Update Dependencies

# Keeps the mathlib pin moving using the leanprover-community/downstream-reports
# composite actions (TauCeti is registered as a downstream there). Daily behavior:
#   - mathlib compatible: open/update a single "bump to last-known-good" PR.
#   - mathlib incompatible: open a tracking issue naming the first-known-bad mathlib
#     commit, plus a fix PR whose manifest is pinned at that commit (a ready-made branch to fix in
#     place — not for merging as-is), and close the LKG bump PR until resolved.
# PRs and pushes use the tauceti-review-bot App token so pr-build/review trigger
# normally. Both update paths preserve Mathlib's `master` nomination and change only the
# manifest/toolchain pins, so bump-guard can validate and auto-merge them once green.

on:
  schedule:
  - cron: "0 17 * * *"
  workflow_dispatch:

env:
  LKG_BRANCH: hopscotch/lkg-bump

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Suppress the LKG bump while a regression is active: the only open PR
      # should be the fix one carrying the first-known-bad manifest pin.
      - name: Check whether an incompatibility is reported
        id: fkb
        uses: leanprover-community/downstream-reports/.github/actions/query-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          query-type: first-known-bad

      - name: Bump to latest mathlib
        id: bump
        if: steps.fkb.outputs.commit == ''
        uses: leanprover-community/downstream-reports/.github/actions/bump-to-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          preserve-lakefile: true

      # The examples project under web/ compiles the TauCeti library, so it carries its own copies
      # of the root toolchain and Mathlib pins; scripts/test_web_pins.py explains why they have to
      # match. Nothing in Lake keeps the copies honest, and this workflow moved the root pins every
      # day without ever touching them. By September 2026 the examples project was two Lean
      # releases and several hundred Mathlib commits behind, the site build had been failing for a
      # day on a file that compiled fine at the root pins, and every pull request was green
      # throughout, because nothing outside pages.yml builds that project.
      #
      # Syncing here rather than afterwards puts the copies in the same commit as the pins they
      # follow: open-bump-pr commits the whole working tree with `git add -A`, so this rides along
      # with the bump and bump-guard validates them together.
      - name: Carry the site's examples pins along with the bump
        if: steps.fkb.outputs.commit == '' && steps.bump.outputs.updated == 'true'
        run: python3 scripts/sync_web_pins.py

      - name: Open or update PR
        if: steps.fkb.outputs.commit == '' && steps.bump.outputs.updated == 'true'
        uses: leanprover-community/downstream-reports/.github/actions/open-bump-pr@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          branch: ${{ env.LKG_BRANCH }}
          title: "chore: ${{ steps.bump.outputs.pr-title }}"
          message: ${{ steps.bump.outputs.bump-description }}
          commit-message: ${{ steps.bump.outputs.commit-message }}
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: tauceti-review-bot[bot]
          git-user-email: 290224625+tauceti-review-bot[bot]@users.noreply.github.com

  open-issue:
    runs-on: ubuntu-latest
    needs: bump
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject

      - uses: actions/checkout@v4

      - name: Open or update incompatibility issue and fix PR
        id: track
        uses: leanprover-community/downstream-reports/.github/actions/track-incompatibility@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          open-pr: true
          preserve-lakefile: true
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: tauceti-review-bot[bot]
          git-user-email: 290224625+tauceti-review-bot[bot]@users.noreply.github.com

      # Same pin copies as on the bump path above, but track-incompatibility changes the manifest
      # and pushes inside one action, so they cannot be synced before its commit. Push them as a
      # follow-up instead. Without this every fix PR opens with test_web_pins.py already red for a
      # reason unrelated to the incompatibility being fixed, and — worse — the examples project
      # would go on compiling the library against a Mathlib the fix branch has deliberately moved
      # away from. The push uses the App token rather than the checkout's GITHUB_TOKEN so that
      # pr-build and the review pipeline actually fire on the new head.
      - name: Carry the site's examples pins onto the fix branch
        if: steps.track.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.track.outputs.pr-number }}
        run: |
          set -euo pipefail
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          git fetch origin "$branch"
          git checkout "$branch"
          python3 scripts/sync_web_pins.py
          if git diff --quiet; then
            echo "examples pins already match the fix manifest; nothing to push"
            exit 0
          fi
          git config user.name "tauceti-review-bot[bot]"
          git config user.email "290224625+tauceti-review-bot[bot]@users.noreply.github.com"
          git commit -am "chore: point web/examples at the first-known-bad manifest"
          git config --unset http.https://github.com/.extraheader || true
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

      - name: Close the LKG bump PR while a fix PR is open
        if: steps.track.outputs.pr-action == 'created' || steps.track.outputs.pr-action == 'noop-existing'
        env:
          GH_TOKEN: ${{ github.token }}
          FKB_PR: ${{ steps.track.outputs.pr-number }}
        run: |
          set -euo pipefail
          lkg_pr=$(gh pr list --state open --head "$LKG_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$lkg_pr" ]; then
            echo "No open LKG bump PR; nothing to close."
            exit 0
          fi
          gh pr close "$lkg_pr" --comment "Closing in favor of #${FKB_PR}: TauCeti is currently incompatible with the latest mathlib, so attention should go to the PR whose manifest is pinned at the first-known-bad commit. A new last-known-good bump PR will be opened automatically once the incompatibility is resolved."
