name: Update Dependencies

# Keeps the mathlib pin moving using the leanprover-community/downstream-reports
# composite actions (TauCeti is registered as a downstream there). Daily behavior:
#   - mathlib compatible: open/update a single "bump to last-known-good" PR.
#   - mathlib incompatible: open a tracking issue naming the first-known-bad mathlib
#     commit, plus a fix PR whose manifest is pinned at that commit (a ready-made branch to fix in
#     place — not for merging as-is), and close the LKG bump PR until resolved.
# PRs and pushes use the tauceti-review-bot App token so pr-build/review trigger
# normally. Both update paths preserve Mathlib's `master` nomination and change only the
# manifest/toolchain pins, so bump-guard can validate and auto-merge them once green.
#
# Stepping stones. Mathlib's `vX` tag sits on the commit that bumps its own lean-toolchain
# to X, so the window in which main could pin a release is one Mathlib toolchain era, and
# for a stable release that has been as little as fifteen hours. Taking the last-known-good
# commit every day steps clean over such a window, and did over v4.33.0. So when the LKG
# target lies past a release tag main has not reached, this job pins THAT tag first, on its
# own branch, and holds the ordinary bump back until it merges. The exact release commit
# then exists on main and `release-tag.yml` can build, publish and tag it, instead of
# someone having to construct it afterwards.
#
# A stepping stone must never be able to freeze dependency updates, so it has a hard
# lifetime rather than a CI-colour test: once it is past that lifetime, which the daily run
# checks, it is demoted whatever its colour, and demotion parks its head on `releases/<tag>`
# where a human can dispatch release-tag.yml against it. Since the check runs on a schedule
# the lifetime is a floor rather than an exact deadline: a stone opened shortly before a run
# survives to the following one. A first-known-bad regression outranks it entirely.
#
# Nothing here may be the reason bumps stop. Failing to open the stone, and failing to park
# its head on demotion, both fall through to the ordinary bump rather than holding the pin.
#
# Two limits worth knowing. The snapshot returns only the LATEST release reachable from the
# last-known-good commit, so if two releases fall inside one gap, which is easy while a
# regression has suppressed this path for weeks, the older one is still stepped over and
# has to be built from a constructed branch afterwards. And a regression appearing while a
# stone is open demotes it immediately, forfeiting the on-main commit for that release.

on:
  schedule:
  - cron: "0 17 * * *"
  workflow_dispatch:

env:
  LKG_BRANCH: hopscotch/lkg-bump
  # Upstream's own suggested name for this case; bump-to-latest's step 1.5 probe watches
  # whichever branch it is given, so this must match the one open-bump-pr writes.
  STONE_BRANCH: hopscotch/tag-bump
  # How long a stepping stone may stay open before it is demoted. Twenty hours, not
  # twenty-four: this job runs at 17:00, so a stone opened at 17:01 is 23.98 hours old at
  # the next tick and a 24 hour threshold would silently become 48. The upper bound is
  # stuck_alerts' PIN_STALE_DAYS = 4, which would otherwise fire an emergency alert caused
  # by a policy we chose.
  STONE_LIFETIME_HOURS: "20"
  # A hold label buys one further tick and no more. Parking a stone parks every dependency
  # update behind it, so it is bounded and it is alerted, never a quiet freeze.
  STONE_HOLD_HOURS: "44"

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      stone-demoted: ${{ steps.stone_close.outputs.demoted }}
      stone-release: ${{ steps.stone_close.outputs.release }}
      stone-branch: ${{ steps.stone_close.outputs.branch }}
      stone-head: ${{ steps.stone_close.outputs.head }}
      stone-reason: ${{ steps.stone_close.outputs.reason }}
      stone-parked: ${{ steps.stone_close.outputs.parked }}
      stone-fkb: ${{ steps.stone_close.outputs.fkb }}
      stone-closed: ${{ steps.stone_close.outputs.closed }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Suppress the LKG bump while a regression is active: the only open PR
      # should be the fix one carrying the first-known-bad manifest pin.
      - name: Check whether an incompatibility is reported
        id: fkb
        uses: leanprover-community/downstream-reports/.github/actions/query-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          query-type: first-known-bad

      # Is a stepping stone in flight, and for how long? The clock is the PR's own
      # created_at, which is stable precisely because the stone step below is skipped
      # while one is open: unlike the LKG branch, this one is never force-pushed
      # underneath itself, so its age means what it says.
      - name: Look for an open stepping stone
        id: stone_state
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --head "$STONE_BRANCH" \
            --json number,createdAt,headRefOid,body,labels --jq '.[0] // empty' \
            > "$RUNNER_TEMP/stone.json"
          if [ ! -s "$RUNNER_TEMP/stone.json" ]; then
            echo "open=" >> "$GITHUB_OUTPUT"
            echo "no stepping stone in flight"
            exit 0
          fi
          # Through a file, never a shell interpolation: the body is whatever the branch's
          # last pusher wrote.
          python3 - "$RUNNER_TEMP/stone.json" <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import json
          import re
          import sys

          pr = json.load(open(sys.argv[1]))
          created = datetime.datetime.fromisoformat(pr["createdAt"].replace("Z", "+00:00"))
          age = (datetime.datetime.now(datetime.timezone.utc) - created).total_seconds() / 3600
          held = bool({n["name"].lower() for n in pr.get("labels", [])}
                      & {"keep", "hold", "wip", "human", "do-not-close", "blocked"})
          marker = re.search(r"<!--tauceti-stepping-stone:v1 (v[0-9][0-9A-Za-z.\-]*)-->",
                             pr.get("body") or "")
          if marker is None:
              # Without the marker there is no way to know which release the stone is for,
              # and demotion has to name a branch. Say so rather than guess.
              #
              # To STDERR, and that is not a detail: this block's stdout IS $GITHUB_OUTPUT,
              # and the runner rejects any line there that is not `key=value`, failing the
              # step. Printing this diagnostic to stdout would have turned the
              # marker-missing case, the one case this branch exists to report, into a hard
              # failure of the daily bump on every subsequent run.
              print("::warning::the open stepping stone carries no release marker",
                    file=sys.stderr)
          print(f"open={pr['number']}")
          print(f"head={pr['headRefOid']}")
          print(f"age={age:.2f}")
          print(f"held={'true' if held else 'false'}")
          print(f"release={marker.group(1) if marker else ''}")
          PY

      - name: Report the open stepping stone
        if: steps.stone_state.outputs.open != ''
        env:
          PR: ${{ steps.stone_state.outputs.open }}
          RELEASE: ${{ steps.stone_state.outputs.release }}
          AGE: ${{ steps.stone_state.outputs.age }}
          HELD: ${{ steps.stone_state.outputs.held }}
        run: |
          echo "stepping stone: PR $PR for ${RELEASE:-an unmarked release}, ${AGE}h old, held=$HELD"

      # Close and demote BEFORE the bump decision below, so ordinary bumps resume in this
      # same run rather than a day later. Demotion is what makes closing safe: the head is
      # a pin-only commit off main, exactly the shape release-tag.yml accepts, so parking
      # it on `releases/<tag>` keeps the release reachable and stops the next run
      # re-opening the same PR.
      - name: Demote a stepping stone that has run out of time
        id: stone_close
        continue-on-error: true
        if: steps.stone_state.outputs.open != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          FKB: ${{ steps.fkb.outputs.commit }}
          PR: ${{ steps.stone_state.outputs.open }}
          HEAD_SHA: ${{ steps.stone_state.outputs.head }}
          AGE: ${{ steps.stone_state.outputs.age }}
          HELD: ${{ steps.stone_state.outputs.held }}
          RELEASE: ${{ steps.stone_state.outputs.release }}
        run: |
          set -euo pipefail
          reason=""
          if [ -n "$FKB" ]; then
            # A first-known-bad regression outranks a stepping stone: the fix PR owns the
            # pin, and update.yml already closes the LKG PR for the same reason.
            reason="an incompatibility is active, so the first-known-bad fix owns the pin"
          elif [ "$HELD" = "true" ]; then
            if awk -v a="$AGE" -v b="$STONE_HOLD_HOURS" 'BEGIN{exit !(a >= b)}'; then
              reason="it is labelled to be held but has now blocked dependency updates for ${AGE}h"
            fi
          elif awk -v a="$AGE" -v b="$STONE_LIFETIME_HOURS" 'BEGIN{exit !(a >= b)}'; then
            reason="it did not merge within its ${STONE_LIFETIME_HOURS}h lifetime"
          fi
          if [ -z "$reason" ]; then
            echo "demoted=false" >> "$GITHUB_OUTPUT"
            echo "the stepping stone is still within its lifetime; leaving it alone"
            exit 0
          fi
          echo "demoting: $reason"
          branch=""
          parked=false
          if [ -n "$RELEASE" ]; then
            branch="releases/$RELEASE"
            # Parking the head is what makes closing safe, so only "it is already there"
            # counts as success. Swallowing every error would let a ruleset or a permission
            # gap silently discard the commit while the close comment claims it was kept,
            # and would then re-create the same stone every day for ever, because main's pin
            # never passes the tag that provokes it.
            if err="$(gh api -X POST "repos/$REPO/git/refs" \
                        -f ref="refs/heads/$branch" -f sha="$HEAD_SHA" 2>&1 >/dev/null)"; then
              echo "parked the stone's head on $branch"
              parked=true
            elif printf '%s' "$err" | grep -q "Reference already exists"; then
              at="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha' 2>/dev/null || true)"
              if [ "$at" = "$HEAD_SHA" ]; then
                echo "::notice::$branch already points at this head"
                parked=true
              else
                # Existence is not the fact the ref is meant to record. A branch pointing
                # somewhere else must not stand in for a parked commit.
                echo "::warning::$branch already exists but points at ${at:-an unreadable ref}, not $HEAD_SHA; not overwriting it"
              fi
            else
              # Close anyway. An earlier version left the PR open here, which merely traded
              # one permanent freeze for another: every later run took the same path and
              # bumps never resumed. Nothing is really lost, since the head sha is on the
              # closed PR and in the alert; what is lost is the automatic route to a tag for
              # this one release, which is worth far less than the pin continuing to move.
              echo "::error::could not park the stone's head on $branch: $err"
            fi
          else
            echo "::warning::no release marker on the stone, so its head is not parked on a branch"
          fi
          if [ "$parked" = "true" ] && [ -n "$branch" ]; then
            where="Its head is parked on \`$branch\`, still the commit that pins mathlib at \`$RELEASE\` exactly, so a human can dispatch \`release-tag.yml\` against it."
          else
            where="Its head \`$HEAD_SHA\` could NOT be parked on a branch. Record that sha now if this release is still wanted."
          fi
          if [ -n "$FKB" ]; then
            resumes="An incompatibility is still active, so ordinary bumps stay suppressed until it clears; this stone is simply no longer part of why."
          else
            resumes="Ordinary dependency bumps resume from this run."
          fi
          closed=true
          gh pr close "$PR" --repo "$REPO" --comment "Closing this stepping stone: $reason.

          $where
          If Tau Ceti genuinely does not compile at that mathlib commit, the fix belongs on
          \`main\` as an ordinary PR, after which re-cut the branch; \`releases/*\` is a pin-only
          namespace and never a place code lands.

          $resumes" || {
            # Expiry is the fact; closing is only how it is recorded. If the close fails the
            # stone is still demoted, or a persistent close error would suppress the ordinary
            # bump every day for ever, which is the failure this whole policy exists to avoid.
            echo "::error::could not close the stepping stone PR $PR; treating it as demoted anyway so bumps resume"
            closed=false
          }
          {
            echo "demoted=true"
            echo "closed=$closed"
            echo "parked=$parked"
            echo "fkb=${FKB:+active}"
            echo "release=$RELEASE"
            echo "branch=$branch"
            echo "head=$HEAD_SHA"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      # Only when nothing else owns the pin: no active regression, and no stone still open.
      - name: Look up the latest mathlib release reachable from the last-known-good commit
        id: rel
        continue-on-error: true
        if: >-
          steps.fkb.outputs.commit == ''
          && (steps.stone_state.outputs.open == '' || steps.stone_close.outputs.demoted == 'true')
        uses: leanprover-community/downstream-reports/.github/actions/query-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          query-type: last-good-release

      # Already handled means: the release is tagged, or its commit is parked on a release
      # branch for release-tag.yml. Both are durable records held by GitHub, so the state
      # machine needs no store of its own, exactly as stuck_alerts.py needs none.
      - name: Has this release already been handled?
        id: stone_handled
        continue-on-error: true
        if: steps.rel.outputs.rev != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          # From `rel`, the query, because this step runs BEFORE `stone`. Reading the
          # action's output here left this empty, marked every release handled, and turned
          # the whole stepping-stone path into a no-op without saying anything.
          TAG: ${{ steps.rel.outputs.rev }}
          M: ${{ steps.rel.outputs.commit }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            # Not fatal. This value comes from a third-party snapshot, and it is only used to
            # decide whether to build a stepping stone; a schema change upstream must not be
            # able to stop the daily bump, which is the one job that must never stop.
            echo "::warning::the snapshot returned '$TAG', which is not a release tag name; skipping the stepping stone"
            echo "handled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "handled=true" >> "$GITHUB_OUTPUT"; echo "$TAG is already tagged"; exit 0
          fi
          head="$(gh api "repos/$REPO/git/ref/heads/releases/$TAG" --jq '.object.sha' 2>/dev/null || true)"
          if [ -n "$head" ]; then
            # Existence is not the fact the branch stands for. A stale or mispointed
            # `releases/` ref would otherwise mark the release handled for ever, and nothing
            # would ever try again.
            pinned="$(gh api "repos/$REPO/contents/lake-manifest.json?ref=$head" --jq '.content' 2>/dev/null \
                        | base64 -d 2>/dev/null \
                        | python3 -c 'import json,sys; print(next((p["rev"] for p in json.load(sys.stdin)["packages"] if p.get("name")=="mathlib"), ""))' 2>/dev/null || true)"
            if [ "$pinned" = "$M" ]; then
              echo "handled=true" >> "$GITHUB_OUTPUT"
              echo "$TAG already has a release branch pinning $M"; exit 0
            fi
            echo "::warning::releases/$TAG exists at $head but pins ${pinned:-nothing recognisable}, not $M; treating $TAG as unhandled so a stepping stone can still put it on main"
          fi
          echo "handled=false" >> "$GITHUB_OUTPUT"

      # `preserve-lakefile` is mandatory, not stylistic: without it hopscotch writes the tag
      # name into the manifest's inputRev, and check-bump.sh rejects a changed nomination
      # outright, so the PR could never auto-merge. `skip-build` is what makes the lifetime
      # policy coherent: with a build, hopscotch reports updated=false on failure, the PR is
      # never opened at all, and the LKG bump sails straight over the release in exactly the
      # case this exists for. pr-build is the judge instead. `apply-fixes` stays at its
      # default false because applied fixes are changes to TauCeti/, which would both break
      # auto-merge and destroy the two-pin-files-only property release-tag.yml relies on.
      - name: Pin mathlib at the release tag (stepping stone)
        id: stone
        # A stepping stone is an optimisation: it puts the exact release commit on main
        # instead of on a constructed branch. If preparing it fails, that is a worse tag
        # story for one release, not a reason to stop dependency updates. Without this the
        # failed step would trip the implicit success() guard on every later step, skipping
        # the ordinary bump, and since no PR was opened there would be no clock and no
        # demotion path to recover through: the same failure every day, for ever.
        continue-on-error: true
        if: >-
          steps.fkb.outputs.commit == ''
          && steps.stone_state.outputs.open == ''
          && steps.stone_handled.outputs.handled == 'false'
        uses: leanprover-community/downstream-reports/.github/actions/bump-to-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          query-type: last-good-release
          branch: ${{ env.STONE_BRANCH }}
          preserve-lakefile: true
          skip-build: true

      - name: Open or update the stepping-stone PR
        id: stone_pr
        continue-on-error: true   # same reason as above
        if: steps.stone.outputs.updated == 'true'
        uses: leanprover-community/downstream-reports/.github/actions/open-bump-pr@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          branch: ${{ env.STONE_BRANCH }}
          title: "chore: pin mathlib at ${{ steps.stone.outputs.rev }} (release stepping stone)"
          commit-message: "chore: pin mathlib at ${{ steps.stone.outputs.rev }}"
          # Every field below comes from `stone`, the step that actually moved the pin, not
          # from the earlier `rel` query: the two read the snapshot independently and can
          # disagree, and a marker naming a different release from the one the branch pins
          # would park the wrong commit under that release's name, permanently.
          #
          # `body` rather than `message`, which would sit above open-bump-pr's own footer.
          # That footer states that `lake build` was run against the new commit and
          # succeeded; with `skip-build: true` no build was run at all, and a PR that
          # advertises a build it never did is worse than one with no footer.
          body: |
            The last-known-good bump is about to step over mathlib's `${{ steps.stone.outputs.rev }}`
            tag, which main's pin has not reached. This PR pins mathlib at that tag exactly
            (`${{ steps.stone.outputs.commit }}`), so the release can be built, cached and tagged from
            a real main commit rather than from one constructed afterwards.

            Ordinary dependency bumps are held back until this merges. If it has not merged by
            the next daily run it is closed automatically and its head is parked on
            `releases/${{ steps.stone.outputs.rev }}`, so nothing here can freeze the bump.

            <!--tauceti-stepping-stone:v1 ${{ steps.stone.outputs.rev }}-->
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: tauceti-review-bot[bot]
          git-user-email: 290224625+tauceti-review-bot[bot]@users.noreply.github.com

      # The `demoted` disjunct is what makes "bumps resume in this same run" true. Without
      # it a demotion run stops after closing the stone, every stone costs two frozen daily
      # ticks instead of one, and a stone whose demotion cannot park its head would be
      # re-created the next day for ever, because main's pin never passes the tag that
      # provokes it.
      # Whatever the stone left behind, the ordinary bump below must start from the tree
      # this run was scheduled against. Restoring individual paths from HEAD is not enough:
      # `open-bump-pr` may already have committed onto its own branch, in which case HEAD is
      # the stone commit and restoring from it is a no-op, and a `lake update` that failed
      # part way leaves state the undo never named. This is an ephemeral runner checkout, so
      # putting the whole thing back to $GITHUB_SHA is both safe and the only way to be sure.
      # `-fd` and not `-fdx`: ignored files include the tooling and caches this job needs.
      - name: Restore the workspace when the stepping stone did not produce a PR
        if: >-
          steps.stone.outcome == 'failure'
          || (steps.stone.outputs.updated == 'true' && steps.stone_pr.outcome != 'success')
        run: |
          set -euo pipefail
          echo "::warning::the stepping stone did not produce a PR; restoring the workspace and letting the ordinary bump proceed"
          git checkout --force "$GITHUB_SHA"
          git clean -fd
          git status --short

      - name: Bump to latest mathlib
        id: bump
        # `!cancelled()` rather than the implicit success(): a failure in ANY of the
        # optional stepping-stone steps above must not be able to stop the bump. That guard
        # is how this workflow acquired a new way to freeze the pin in each of four review
        # rounds, so the condition names what it depends on instead of inheriting it.
        if: >-
          !cancelled()
          && steps.fkb.outputs.commit == ''
          && (steps.stone_state.outputs.open == ''
              || steps.stone_close.outputs.demoted == 'true')
          && (steps.stone.outcome == 'failure'
              || steps.stone.outputs.updated != 'true'
              || steps.stone_pr.outcome != 'success')
        uses: leanprover-community/downstream-reports/.github/actions/bump-to-latest@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          preserve-lakefile: true

      - name: Open or update PR
        # `!cancelled()` rather than the implicit success(): a failure in ANY of the
        # optional stepping-stone steps above must not be able to stop the bump. That guard
        # is how this workflow acquired a new way to freeze the pin in each of four review
        # rounds, so the condition names what it depends on instead of inheriting it.
        if: >-
          !cancelled()
          && steps.fkb.outputs.commit == ''
          && (steps.stone_state.outputs.open == ''
              || steps.stone_close.outputs.demoted == 'true')
          && (steps.stone.outcome == 'failure'
              || steps.stone.outputs.updated != 'true'
              || steps.stone_pr.outcome != 'success')
          && steps.bump.outputs.updated == 'true'
        uses: leanprover-community/downstream-reports/.github/actions/open-bump-pr@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          branch: ${{ env.LKG_BRANCH }}
          title: "chore: ${{ steps.bump.outputs.pr-title }}"
          message: ${{ steps.bump.outputs.bump-description }}
          commit-message: ${{ steps.bump.outputs.commit-message }}
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: tauceti-review-bot[bot]
          git-user-email: 290224625+tauceti-review-bot[bot]@users.noreply.github.com

  # A demoted stepping stone is worth a person's attention: dependency bumps have resumed,
  # but a release now has no commit on main and needs the release-branch path instead. Its
  # own job on a fresh runner, because the bump job runs a downloaded hopscotch binary and
  # a `lake update` that evaluates mathlib's lakefile, so it must not hold Zulip
  # credentials. Same shape as nightly-verify.yml's reporter.
  report-demotion:
    runs-on: ubuntu-latest
    needs: bump
    if: ${{ always() && github.repository == 'TauCetiProject/TauCeti'
            && needs.bump.outputs.stone-demoted == 'true' }}
    timeout-minutes: 10
    steps:
      - name: Post the demotion to Zulip
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_SITE: https://leanprover.zulipchat.com
          ZULIP_CHANNEL: Tau Ceti
          # The same topic release-tag.yml and the toolchain-tag audit report to, and not
          # "Stuck PRs", which stuck_alerts.py reconciles by marker.
          ZULIP_TOPIC: Releases
          RELEASE: ${{ needs.bump.outputs.stone-release }}
          BRANCH: ${{ needs.bump.outputs.stone-branch }}
          PARKED: ${{ needs.bump.outputs.stone-parked }}
          FKB: ${{ needs.bump.outputs.stone-fkb }}
          HEAD_SHA: ${{ needs.bump.outputs.stone-head }}
          REASON: ${{ needs.bump.outputs.stone-reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          import sys
          import urllib.parse
          import urllib.request

          release = os.environ.get("RELEASE") or "an unmarked release"
          branch = os.environ.get("BRANCH") or ""
          head = (os.environ.get("HEAD_SHA") or "")[:8]
          reason = os.environ.get("REASON") or "it ran out of time"
          lines = [f"**The stepping stone for `{release}` was demoted**, because {reason}."]
          lines.append(
              "An incompatibility is still active, so ordinary bumps stay suppressed until "
              "it clears; this stone is no longer part of why."
              if os.environ.get("FKB") else "Ordinary mathlib bumps have resumed.")
          if os.environ.get("PARKED") == "false":
              lines.append(
                  f"Its head `{head}` could NOT be parked on a branch, so there is no durable "
                  f"record of it beyond the closed PR and this message. If `{release}` is still "
                  f"wanted, note that sha now and cut the branch by hand.")
          elif branch:
              lines.append(
                  f"Its head `{head}` is parked on `{branch}`, which still pins mathlib at "
                  f"`{release}` exactly, so `release-tag.yml` can build, publish and tag it "
                  f"from there. If Tau Ceti does not compile at that mathlib commit, the fix "
                  f"belongs on `main` as an ordinary PR and the branch is then re-cut; "
                  f"`releases/*` is a pin-only namespace and never a place code lands.")
          else:
              lines.append(
                  "It carried no release marker, so its head was NOT parked on a branch. "
                  "Find the commit on the closed PR before it is garbage collected.")
          lines.append(f"[Run log]({os.environ['RUN_URL']})")
          content = "\n\n".join(lines)

          email = (os.environ.get("ZULIP_EMAIL") or "").strip()
          key = (os.environ.get("ZULIP_API_KEY") or "").strip()
          site = (os.environ.get("ZULIP_SITE") or "").strip().rstrip("/")
          if not (email and key and site):
              print("::error::ZULIP_EMAIL / ZULIP_API_KEY not set; cannot report the demotion")
              sys.exit(1)
          data = urllib.parse.urlencode({
              "type": "stream",
              "to": os.environ["ZULIP_CHANNEL"],
              "topic": os.environ["ZULIP_TOPIC"],
              "content": content,
          }).encode()
          req = urllib.request.Request(site + "/api/v1/messages", data=data, method="POST")
          req.add_header("Authorization",
                         "Basic " + base64.b64encode(f"{email}:{key}".encode()).decode())
          req.add_header("Content-Type", "application/x-www-form-urlencoded")
          with urllib.request.urlopen(req, timeout=30) as response:
              print(f"zulip: HTTP {response.status}")
          PY

  open-issue:
    runs-on: ubuntu-latest
    needs: bump
    # `always()` because the incompatibility path must outrank everything, including a
    # failure in the bump job itself. Without it, one transient `gh` error, or any bug in
    # the stepping-stone steps, would silently cost that day its regression tracking too.
    # `track-incompatibility` is a no-op when no regression is reported.
    if: ${{ always() && github.repository == 'TauCetiProject/TauCeti' }}
    permissions:
      issues: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: TauCetiProject

      - uses: actions/checkout@v4

      - name: Open or update incompatibility issue and fix PR
        id: track
        uses: leanprover-community/downstream-reports/.github/actions/track-incompatibility@62750c6a09e73013f9c23c7ee007c612793fe9a2
        with:
          open-pr: true
          preserve-lakefile: true
          token: ${{ steps.app-token.outputs.token }}
          git-user-name: tauceti-review-bot[bot]
          git-user-email: 290224625+tauceti-review-bot[bot]@users.noreply.github.com

      - name: Close the LKG bump PR while a fix PR is open
        if: steps.track.outputs.pr-action == 'created' || steps.track.outputs.pr-action == 'noop-existing'
        env:
          GH_TOKEN: ${{ github.token }}
          FKB_PR: ${{ steps.track.outputs.pr-number }}
        run: |
          set -euo pipefail
          lkg_pr=$(gh pr list --state open --head "$LKG_BRANCH" --json number --jq '.[0].number // empty')
          if [ -z "$lkg_pr" ]; then
            echo "No open LKG bump PR; nothing to close."
            exit 0
          fi
          gh pr close "$lkg_pr" --comment "Closing in favor of #${FKB_PR}: TauCeti is currently incompatible with the latest mathlib, so attention should go to the PR whose manifest is pinned at the first-known-bad commit. A new last-known-good bump PR will be opened automatically once the incompatibility is resolved."
