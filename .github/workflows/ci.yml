name: CI

on:
  # PR builds moved to pr-build.yml, which sandboxes untrusted PR code under landrun in a
  # trusted (base-defined) workflow. This run is only the post-merge health check on main.
  push:
    branches: [main]

permissions:
  contents: read

# Keep the cache publisher live under a burst of main pushes. GitHub retains at
# most one running and one pending run in this group: the running build is never
# cancelled before it can publish, while superseded pending commits do not each
# start an expensive cache-miss rebuild. In a burst, this deliberately coalesces
# intermediate commits' post-merge checks too; the newest pending tip rechecks
# the entire tree, though localizing a failure may then require bisection. No
# merge decision consumes this post-merge workflow's per-commit conclusion.
concurrency:
  group: main-ci-cache-publisher
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Read by publish-lake-cache below, the only job that ever holds the upload secret.
    # Neither output reveals the secret's value or whether it is set, and neither is trusted
    # there: `staged` only decides whether that job runs at all, and `reported-toolchain` is
    # cross-checked against the pin that job reads for itself.
    outputs:
      staged: ${{ steps.stage.outputs.staged }}
      reported-toolchain: ${{ steps.stage.outputs.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          # This job elaborates every TauCeti module, and Lean runs code at elaboration time.
          # Without this, checkout leaves an http.extraheader carrying GITHUB_TOKEN in the
          # workspace .git/config for the whole job, within reach of that code. Nothing here
          # needs it: no step calls the GitHub API or pushes, `lake exe cache get` talks to
          # Mathlib's own server, scripts/lake-cache-get.sh does anonymous GETs, and
          # `lake cache get` reads the local revision from .git without authenticating.
          persist-credentials: false
          # Enough history for `lake cache get` to backtrack to a recently-published
          # ancestor commit (its `--max-revs`) when the tip itself has no mapping yet.
          # Harmless (just a slightly deeper fetch) when the cache is off.
          fetch-depth: 100

      - name: Infrastructure policy unit tests
        run: |
          PYTHONPATH=scripts python3 scripts/test_loc_graph.py
          PYTHONPATH=scripts python3 scripts/test_loc_roadmap_graph.py
          PYTHONPATH=scripts python3 scripts/test_participant_graph.py
          PYTHONPATH=scripts python3 scripts/test_pr_stats_graphs.py
          PYTHONPATH=scripts python3 scripts/test_pr_lifecycle.py
          PYTHONPATH=scripts python3 scripts/test_pipeline_health.py
          python3 scripts/pr_status/test_stuck_alerts.py
          python3 scripts/test_roadmap_label.py
          python3 scripts/pr_status/test_pr_labels.py
          python3 scripts/pr_status/test_zulip.py
          python3 scripts/test_structure_nudge.py
          python3 scripts/test_workflow_pins.py
          python3 scripts/test_landrun_pin.py
          python3 scripts/test_elan_pin.py
          python3 scripts/test_attest_pr_config.py
          python3 scripts/test_profile_workflow.py
          python3 scripts/test_lake_cache_probe.py
          PYTHONPATH=. python3 scripts/perf/test_perf.py
          PYTHONPATH=scripts python3 scripts/test_claims_access.py
          python3 scripts/test_lint_dot_notation.py
          python3 scripts/test_toolchain_tags.py

      # The two-library split is build convenience, not a trust boundary.
      # This guard is what actually stops the AI-owned library from inheriting
      # sorried declarations: TauCeti/ may not import the roadmap/review trees.
      - name: Import-boundary guard (TauCeti/ and TauCeti.lean ⊬ roadmap/review)
        run: |
          if grep -rIn -E '^[[:space:]]*import[[:space:]]+(TauCetiRoadmap|TauCetiReview)\b' TauCeti/ TauCeti.lean; then
            echo "::error::TauCeti/ and TauCeti.lean must not import TauCetiRoadmap or TauCetiReview"
            exit 1
          fi

      # No-set_option guard. `set_option` is an escape hatch (it can raise maxHeartbeats,
      # silence linters, bump maxRecDepth, ...), so TauCeti/ source may not use it. Like the
      # import guard it is a textual scan that needs no elaboration, so it runs trusted and
      # outside the sandbox.
      - name: No-set_option guard (TauCeti/ and TauCeti.lean use no set_option)
        run: |
          if grep -rIn '^set_option ' TauCeti/ TauCeti.lean; then
            echo "::error::TauCeti/ and TauCeti.lean may not use set_option (it can weaken maxHeartbeats, linters, maxRecDepth, ...); remove it"
            exit 1
          fi

      # Restore only Mathlib's compressed, content-addressed `.ltar` download store. This is
      # deliberately narrower than a cache of the whole multi-gigabyte `./.lake` tree: `lake exe
      # cache get` remains authoritative, locally selects and unpacks the linked hashes, and
      # downloads anything this best-effort snapshot does not contain. The exact key makes a
      # repeated pin cheap; the same-toolchain prefix lets a new Mathlib pin reuse unchanged
      # blobs. The local action credits the corresponding Mathlib design and owns the shared key
      # namespace. Bump its `mathlib-ltar-v1` token if an incompatible or poisoned immutable entry
      # must be abandoned.
      - name: Restore Mathlib's compressed download cache
        id: mathlib_ltar_restore
        uses: ./.github/actions/restore-mathlib-ltars
        with:
          project-dir: .

      # Install elan from a pinned leanprover/elan release, verified by SHA-256, then install the
      # toolchain `lean-toolchain` names. This replaces leanprover/lean-action, which resolved
      # from a floating major tag and installed elan by piping an unpinned installer to `sh`; with
      # its build, test, lint and cache inputs all off, toolchain setup was all it did here. The
      # Mathlib fetch stays an explicit step below so a failed normal fetch can be retried with
      # `get!`, which force-downloads and unpacks every linked file instead of trusting a possibly
      # malformed restored `.ltar`. scripts/test_elan_pin.py keeps the copies of the pin honest.
      - name: Install elan (pinned + checksum) and the toolchain
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Fetch Mathlib oleans, retrying with a forced full refetch
        run: |
          if ! lake exe cache get; then
            echo "::warning::lake exe cache get failed; forcing a full refetch"
            lake exe cache get!
          fi

      # --- Lake artifact-cache restore (dormant until configured) --------------------
      # Restore TauCeti's OWN oleans before building, exactly as pr-build.yml does. Without
      # this, the post-merge run recompiled the whole library from scratch on every push,
      # spending about 49 minutes to reproduce oleans the merge-queue build had produced
      # minutes earlier. Because the publisher is serialized, that capped publication at
      # roughly one snapshot an hour while several commits an hour were landing, and the
      # permanently stale snapshot is what pushed merge-queue builds onto the roughly
      # 55 minute cold-cache path.
      # No-op until the LAKE_CACHE_*_PUBLIC repo variables are set, as on the consuming side.
      - name: Configure the Lake artifact cache (no-op unless the public endpoints are set)
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          if [ -n "$PUBLIC_ARTIFACT_ENDPOINT" ] && [ -n "$PUBLIC_REVISION_ENDPOINT" ]; then
            {
              echo "LAKE_CACHE_DIR=$GITHUB_WORKSPACE/.lake/cache"
              echo "LAKE_ARTIFACT_CACHE=true"
              echo "LAKE_RESTORE_ARTIFACTS=true"
              echo "TAUCETI_CACHE_ENABLED=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Lake artifact cache enabled — restoring TauCeti's oleans and building incrementally"
          else
            echo "::notice::Lake artifact cache not configured — building TauCeti/ from scratch (set the LAKE_CACHE_*_PUBLIC repo variables to enable)"
          fi

      # Anonymous GETs from the PUBLIC read host, the same trusted, publisher-built data
      # pr-build restores. The shared script discards a partial fetch rather than keeping it;
      # see its header.
      #
      # What this does NOT establish: that a restored module matches what a compile of the
      # checked-out source would produce. Lake keys artifacts by an input hash that is a single
      # UInt64 and explicitly not cryptographic (Lake/Build/Trace.lean carries a TODO to replace
      # it), so content addressing is a deduplication scheme here, not an integrity guarantee.
      # Restoring on main also gives up main's former role as the one build that took nothing on
      # faith. nightly-verify.yml reinstates it on a daily cadence: it rebuilds from source with the
      # cache off and compares the resulting oleans byte for byte against a cache-restored build of
      # the same commit. That is a detector, not an equivalent guarantee, and its own header spells
      # out the exposure window it leaves. The two are a pair; do not enable this restore without
      # that nightly running.
      - name: Fetch TauCeti's own oleans from the Lake cache
        if: ${{ env.TAUCETI_CACHE_ENABLED == '1' }}
        env:
          # Passed under non-LAKE_ names so Lake never sees the deprecated endpoint
          # environment variables; the script hands it the endpoints through a `--service` config.
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: bash scripts/lake-cache-get.sh .

      # No aggregator check: the root TauCeti.lean is intentionally empty and imports nothing.
      # The build globs every TauCeti/ module directly, so nothing depends on a root that
      # re-exports the library.
      - name: Build
        env:
          # Restore only from the locally-populated $LAKE_CACHE_DIR the step above filled;
          # never let the build itself reach a remote cache service. Same rule as the
          # sandboxed build in pr-build.yml and as the publish step below.
          LAKE_NO_CACHE: "true"
        run: lake build

      # Main and already-audited merge-group commits publish TauCeti's Lake artifacts through the
      # same secret-isolated workflow. Ordinary PR heads remain restore-only and cannot populate
      # a cache consumed by later builds.
      # GitHub cache keys are immutable; an exact restore needs no redundant save, while a
      # prefix restore is extended with the newly downloaded hashes under the exact current key.
      # Pruning is essential: without it, every prefix restore would carry all old pins forward
      # and each immutable snapshot would grow monotonically. If pruning itself breaks, leave main
      # green but skip publication rather than saving an unbounded snapshot.
      - name: Prune Mathlib's download cache to the current pin
        id: mathlib_ltar_prune
        if: ${{ steps.mathlib_ltar_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: lake exe cache clean

      - name: Save Mathlib's compressed download cache
        if: ${{ steps.mathlib_ltar_restore.outputs.cache-hit != 'true' && steps.mathlib_ltar_prune.outcome == 'success' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.mathlib_ltar_restore.outputs.cache-dir }}/*.ltar
          key: ${{ steps.mathlib_ltar_restore.outputs.cache-primary-key }}

      # Axiom audit (replaces the old textual no-sorry grep). Inspects the built
      # TauCeti environment and rejects any axiom outside {propext, Classical.choice,
      # Quot.sound}, catching sorry/admit (sorryAx), native_decide (Lean.ofReduceBool),
      # and home-rolled axioms, including ones reaching in through imports.
      - name: Axiom audit (TauCeti/ uses only allowlisted axioms)
        env:
          LAKE_NO_CACHE: "true"
        run: lake exe axioms

      # Module-system audit. Inspects the built TauCeti `.olean`s and rejects any module that
      # did not opt into the Lean module system (a leading `module`). It reads each module's
      # `ModuleData.isModule` flag from the compiled artifact, so it cannot be fooled by a
      # `module` appearing in a comment or string the way a textual grep could.
      - name: Module-system audit (every TauCeti/ file opts into `module`)
        env:
          LAKE_NO_CACHE: "true"
        run: lake exe module-system

      # Environment lint. Elaborates a generated driver importing every TauCeti/
      # module and runs Mathlib's default `#lint` set minus docBlame (simpNF,
      # checkType, synTaut, ...) plus a module-system-reliable docstring scan (the
      # docBlame linter is blind across module boundaries; see the script header),
      # comparing linter-qualified violations against the grandfathered baseline in
      # scripts/lint-baseline.txt: new violations fail, fixed baseline entries print
      # a ratchet reminder. `@[nolint <linter>]` applications must be accounted for
      # in scripts/lint-nolints-allowlist.txt, per (linter, declaration) pair.
      # PR-time enforcement runs inside the
      # landrun sandbox in pr-build.yml (this lint executes the linted code); this
      # post-merge run is the health check on main, like the audits above.
      - name: Environment lint (default linters + docstring scan vs grandfathered baseline)
        env:
          LAKE_NO_CACHE: "true"
        run: bash scripts/lint-env.sh

      - name: Dot-notation namespace lint (Mathlib type namespaces stay at root)
        run: python3 scripts/lint-dot-notation.py

      # Source style lint. The wrapper validates one complete TauCeti/** source list, applies
      # Mathlib's copyright/Authors checks directly (the empty TauCeti.lean root is exempt), and
      # generates an import-all module under .lake/ for lint-style's text-based checks. This is
      # deliberately narrower than the command header linter's unrelated import and module-doc
      # checks; the empty root makes that command linter skip every library module at this pin.
      - name: Source style lint (copyright headers + text linters)
        run: bash scripts/lint-style.sh

      # --- Lake artifact-cache publish (dormant until configured) ---------------------
      # Publish TauCeti's OWN oleans (root-package only) to the Lake cache, so pr-build can
      # fetch them and recompile only a PR's changed modules instead of the whole library.
      # Mathlib's oleans are never uploaded: `-o` records only root-package outputs, and
      # Mathlib stays on `lake exe cache get`. See pr-build.yml for the consuming side.
      #
      # The upload is split across two jobs, and the split is the security boundary rather
      # than a convenience. THIS job runs `lake build` unsandboxed, as the runner user, on
      # whatever landed on main, and Lean executes code at elaboration time: `run_cmd`,
      # `initialize` and macro-time IO are all unrestricted, since the scope, import-boundary
      # and set_option guards are textual scans. Such code can therefore rewrite
      # `$HOME/.elan/bin/lake`, prepend a directory of its own to every later step's PATH
      # through `$GITHUB_PATH`, or set LD_PRELOAD or BASH_ENV for every later step through
      # `$GITHUB_ENV`. A secret given to any later step of this job is a secret given to code
      # that landed on main, whatever that step does with it. So this job only stages the
      # artifacts, and publish-lake-cache below, a fresh runner with no checkout, no
      # workspace and no project code, is the only place the key exists.
      - name: Configure the Lake cache staging (no-op unless the S3 endpoints are set)
        id: cachecfg
        env:
          # The secret is deliberately not referenced anywhere in this job, not even to test
          # whether it is set. The endpoints alone decide whether staging runs; the publish
          # job skips with a notice if the key turns out to be missing.
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
        run: |
          if [ -n "$S3_ARTIFACT_ENDPOINT" ] && [ -n "$S3_REVISION_ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Lake cache upload configured; staging TauCeti's oleans"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lake cache upload not configured, skipping (set the LAKE_CACHE_ARTIFACT_ENDPOINT / LAKE_CACHE_REVISION_ENDPOINT repo variables and the LAKE_CACHE_KEY secret to enable)"
          fi

      # Merge-group CI normally publishes and publicly confirms the exact commit before GitHub
      # lands it. Avoid packing and transferring the same map again on main when that happened.
      # This is deliberately fail-open: only a downloaded, structurally valid exact map sets
      # exists=true. A direct human merge has no map, and any 404, timeout, service error or
      # malformed response therefore retains the staging/publication fallback below.
      - name: Probe for this exact cache on the public endpoint
        id: exact_cache
        if: ${{ steps.cachecfg.outputs.enabled == 'true' }}
        env:
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          REVISION: ${{ github.sha }}
        run: |
          echo "exists=false" >> "$GITHUB_OUTPUT"
          TOOLCHAIN="$(cat lean-toolchain 2>/dev/null || true)"
          if python3 scripts/lake_cache_probe.py \
              "$PUBLIC_REVISION_ENDPOINT" "$TOOLCHAIN" "$REVISION"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Exact Lake cache map is already public; skipping duplicate staging and publication"
          else
            echo "::notice::Exact Lake cache map is absent or unreadable; retaining main's publication fallback"
          fi

      - name: Stage TauCeti's oleans for the publish job
        id: stage
        if: ${{ steps.cachecfg.outputs.enabled == 'true' && steps.exact_cache.outputs.exists != 'true' }}
        env:
          # Restated at step level, and the same values the restore step sets job-wide when the
          # public endpoints are configured, so staging works either way: with the restore on,
          # the health-check build already packed these artifacts; with it off, the pack below
          # is what puts them in the cache directory for `lake cache stage` to find.
          LAKE_ARTIFACT_CACHE: "true"
          LAKE_RESTORE_ARTIFACTS: "true"
          # Don't download during the packing build — we only want to PUT, not GET. (The
          # S3 host needs SigV4 even for reads, so an anonymous GET here would 403 anyway.)
          LAKE_NO_CACHE: "true"
          LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
        run: |
          # Pack the already-built oleans into the local Lake cache (no recompile, since the
          # health-check build above left matching traces), emit the root-package
          # input->output mappings, then copy exactly the artifacts those mappings name into
          # a staging directory, alongside a copy of the mappings themselves. `lake cache
          # stage` reads no credential and contacts no network.
          lake build >/dev/null
          lake build --no-build -o .lake/outputs.jsonl
          echo "root-package mapping entries: $(wc -l < .lake/outputs.jsonl)"
          lake cache stage .lake/outputs.jsonl "$RUNNER_TEMP/lake-cache-staging"
          # `lake cache put-staged` does not configure the workspace, which is precisely what
          # keeps project code out of the publish job, so it cannot derive the toolchain and
          # platform halves of the upload scope. The publish job supplies them from the pin
          # instead, which is right only while the package config keeps the two assumptions
          # below. Check them here, where the workspace does exist: `platformIndependent` is
          # what makes Lake leave the platform out of the scope (put-staged's default), while
          # `fixedToolchain` or `bootstrap` would make Lake leave the toolchain out of it (which
          # put-staged is told to include). Either silent mismatch would publish under a scope
          # pr-build's `lake cache get --service ... --repo` never reads, i.e. a cache never hit.
          if ! grep -Eq '^[[:space:]]*platformIndependent[[:space:]]*=[[:space:]]*true' lakefile.toml; then
            echo "::error::lakefile.toml no longer sets platformIndependent = true; publish-lake-cache must now pass --platform to lake cache put-staged"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(fixedToolchain|bootstrap)[[:space:]]*=[[:space:]]*true' lakefile.toml; then
            echo "::error::lakefile.toml now sets fixedToolchain or bootstrap; Lake drops the toolchain from the scope for such a package, so publish-lake-cache must stop passing --toolchain"
            exit 1
          fi
          # `lake env` reports the workspace's own view of the toolchain, which is exactly the
          # `Env.toolchain` Lake scopes an upload by. The publish job does not take this on
          # faith: it reads lean-toolchain itself and fails if the two disagree. Reporting it
          # anyway turns a disagreement into a loud failure instead of a silent wrong scope.
          TOOLCHAIN="$(lake env printenv ELAN_TOOLCHAIN || true)"
          if [ -z "$TOOLCHAIN" ]; then
            echo "::error::could not determine the Lean toolchain that scopes the cache upload"
            exit 1
          fi
          printf 'toolchain=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo "staged=true" >> "$GITHUB_OUTPUT"

      - name: Hand the staged oleans to the publish job
        if: ${{ steps.stage.outputs.staged == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lake-cache-staging
          path: ${{ runner.temp }}/lake-cache-staging
          if-no-files-found: error
          # Long enough to inspect a failed publish, short enough not to accumulate a
          # 60 MB artifact per push to main.
          retention-days: 1
          # The staged files are already-compressed `.ltar` archives; recompressing them
          # burns CPU on both ends and saves nothing.
          compression-level: 0

  # Run the secret-bearing upload on a fresh runner through the same hardened publisher used
  # by merge-group CI. Main publication remains a fallback: merge groups normally publish the
  # exact commit before landing, while this covers human-owned changes and operational retries.
  publish-lake-cache:
    needs: build
    if: ${{ needs.build.outputs.staged == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-lake-cache.yml
    with:
      revision: ${{ github.sha }}
      artifact-name: lake-cache-staging
      reported-toolchain: ${{ needs.build.outputs.reported-toolchain }}
      publication-required: false
    secrets:
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}
