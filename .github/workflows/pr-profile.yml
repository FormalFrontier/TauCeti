name: pr-performance

# Required, base-branch-defined performance gate for untrusted Lean changes.
#
# Security boundary: GitHub/API resolution, config attestation, perf, threshold evaluation,
# status posting, and report rendering run as trusted host steps. Both comparison trees are
# exact immutable commits: merge base versus PR head, or queue base versus combined merge-group
# head. A workflow-pinned harness attests Lake config before every command that can elaborate
# candidate sources runs offline under bwrap. Host perf wraps the bwrap process;
# its raw counter files live in RUNNER_TEMP, which is not mounted in the bwrap sandbox, so
# PR code cannot forge or erase its measurements. No token enters the sandbox.
#
# The required `perf` commit status is separate from the advisory heartbeat
# profile. It uses retired instructions when the runner exposes them and a
# same-runner CPU-time comparison otherwise. Every Lean process also has the
# universal 300-second watchdog installed by scripts/perf/lean-watchdog.sh.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to profile", required: true, type: string }

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request_target' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/profile')))
      && format('pr-performance-{0}',
           github.event.pull_request.number || github.event.issue.number ||
           inputs.pr || github.event.merge_group.head_sha)
      || format('pr-performance-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

env:
  # Temporary escape hatch for `lake exe cache get`, kept only for an easy rollback
  # during the transition to the cache tool's new default read endpoint. Set the
  # variable to `1` to send cache reads back to the legacy storage endpoint. Clear it to
  # return reads to the default endpoint on the next run: the cache tool treats unset,
  # empty, `0`, and `false` alike as off.
  MATHLIB_CACHE_DEBUG_USE_LEGACY: ${{ vars.MATHLIB_CACHE_DEBUG_USE_LEGACY }}

jobs:
  # Deliberately not named `perf`: the authoritative required context is the
  # commit status posted at the end, not this workflow's automatic check-run.
  performance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/profile') &&
       (github.event.comment.user.login == github.event.issue.user.login ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    env:
      BWRAP_VER: 0.9.0-1build1
      BWRAP_DEB_SHA256: dde30d1f24da50446d647ed504ec8dc5a714f171974d054c70a589b48ba38b48
      BWRAP_SHA256: 3e33f8255e1411ada346db27028c25ef5ba4fa3327754a2321ea4c8732a3bc10
      LAKE_ARTIFACT_CACHE: ""
      LAKE_RESTORE_ARTIFACTS: ""
      LAKE_CACHE_DIR: ""
    steps:
      # --- Trusted setup. No PR code runs before the sandboxed measurement steps. ---
      - name: Resolve immutable base and head commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case '${{ github.event_name }}' in
            merge_group)
              NUM=merge-group
              SHA='${{ github.event.merge_group.head_sha }}'
              HEAD_REPO="$TARGET_REPO"
              BASE_SHA='${{ github.event.merge_group.base_sha }}'
              STATUS_SHA="$SHA"
              AUTHOR=''
              MB="$BASE_SHA"
              ;;
            pull_request_target)
              NUM='${{ github.event.pull_request.number }}'
              SHA='${{ github.event.pull_request.head.sha }}'
              HEAD_REPO='${{ github.event.pull_request.head.repo.full_name }}'
              BASE_SHA='${{ github.event.pull_request.base.sha }}'
              STATUS_SHA="$SHA"
              AUTHOR='${{ github.event.pull_request.user.login }}'
              ;;
            issue_comment)
              NUM='${{ github.event.issue.number }}'
              ;;
            workflow_dispatch)
              NUM='${{ inputs.pr }}'
              ;;
          esac
          if [ '${{ github.event_name }}' = issue_comment ] || [ '${{ github.event_name }}' = workflow_dispatch ]; then
            data=$(gh api "repos/$TARGET_REPO/pulls/$NUM")
            SHA=$(jq -r .head.sha <<<"$data")
            HEAD_REPO=$(jq -r .head.repo.full_name <<<"$data")
            BASE_SHA=$(jq -r .base.sha <<<"$data")
            STATUS_SHA="$SHA"
            AUTHOR=$(jq -r .user.login <<<"$data")
          fi
          if [ -z "${MB:-}" ]; then
            OWNER="${HEAD_REPO%%/*}"
            MB=$(gh api "repos/$TARGET_REPO/compare/$BASE_SHA...$OWNER:$SHA" \
              --jq .merge_base_commit.sha)
          fi
          if [ "$NUM" = merge-group ]; then
            COMPARISON_BASE="$BASE_SHA"
          else
            COMPARISON_BASE="$MB"
          fi
          {
            echo "num=$NUM"
            echo "sha=$SHA"
            echo "head_repo=$HEAD_REPO"
            echo "base_sha=$BASE_SHA"
            echo "status_sha=$STATUS_SHA"
            echo "mergebase=$MB"
            echo "comparison_base=$COMPARISON_BASE"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          echo "Performance gate for $NUM: exact $COMPARISON_BASE -> exact $SHA (policy base $BASE_SHA)"

      - name: Post pending perf status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.status_sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending -f context=perf \
            -f description='comparing exact base/head Lean module cost' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Fetch trusted changed-file metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.pr.outputs.num }}
          BASE: ${{ steps.pr.outputs.base_sha }}
          HEAD: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$NUM" = merge-group ]; then
            gh api "repos/${{ github.repository }}/compare/$BASE...$HEAD" --jq .files > "$RUNNER_TEMP/files.json"
            count=$(jq length "$RUNNER_TEMP/files.json")
            if [ "$count" -ge 300 ]; then
              echo "::error::merge-group changed-file list hit GitHub's 300-file compare cap; failing closed"
              exit 1
            fi
          else
            gh api --paginate --slurp \
              "repos/${{ github.repository }}/pulls/$NUM/files?per_page=100" > "$RUNNER_TEMP/file-pages.json"
            jq '[.[][]]' "$RUNNER_TEMP/file-pages.json" > "$RUNNER_TEMP/files.json"
          fi

      - name: Checkout workflow-pinned trusted tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      # Current main is policy input only: a bump must move forward from it. The measured base is
      # the PR's merge base (or the immutable queue base), checked out separately below.
      - name: Checkout current policy base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: policy
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact comparison base with complete cache ancestry
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.comparison_base }}
          path: base
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout exact candidate head with complete cache ancestry
        uses: actions/checkout@v4
        with:
          allow-unsafe-pr-checkout: true
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: head
          persist-credentials: false
          fetch-depth: 0

      # `.lake` sits inside a checkout whose contents the candidate controls, and a symlink
      # committed there gets followed by everything that later writes to that path, each of
      # which then writes outside the checkout as the runner user. Replacing it with a real,
      # empty directory first stops that. `rm -rf` unlinks a symlink rather than following it,
      # which is what makes this work; the absent trailing slash is what keeps it true.
      #
      # There are two reasons this step exists, and they expire differently.
      #
      # The first is the pinned bubblewrap. Noble ships 0.9.0, which follows such a symlink
      # while creating the sandbox's mount point (GHSA-pxhw-h44j-8pfx). Upstream fixed that in
      # 0.12.0, so THIS REASON GOES AWAY once noble carries 0.12.0 or newer and the pin below
      # moves to it.
      #
      # The second does not. `mkdir -p <tree>/.lake/tmp` and the Mathlib cache restore both run
      # in the trusted phase, before any sandbox exists, and both follow the symlink themselves.
      # No bubblewrap version fixes that, because bubblewrap is not involved. So this step stays
      # after the pin moves, unless those two callers are made symlink-safe at the same time.
      - name: Normalise both trees' .lake before anything touches them
        run: |
          set -euo pipefail
          rm -rf base/.lake
          mkdir -p base/.lake
          if [ -L base/.lake ] || [ ! -d base/.lake ]; then
            echo "::error::base/.lake is not a real directory after normalisation"; exit 1
          fi
          rm -rf head/.lake
          mkdir -p head/.lake
          if [ -L head/.lake ] || [ ! -d head/.lake ]; then
            echo "::error::head/.lake is not a real directory after normalisation"; exit 1
          fi

      - name: Classify Lake configuration changes from trusted metadata
        id: config
        run: |
          set -euo pipefail
          if jq -e '.[] | select(.filename == "lakefile.toml" or .filename == "lakefile.lean")' \
               "$RUNNER_TEMP/files.json" >/dev/null; then
            echo 'lakefile-changed=1' >> "$GITHUB_OUTPUT"
          else
            echo 'lakefile-changed=0' >> "$GITHUB_OUTPUT"
          fi
          if jq -e '.[] | select(.filename == "lake-manifest.json" or .filename == "lean-toolchain")' \
               "$RUNNER_TEMP/files.json" >/dev/null; then
            echo 'pins-changed=1' >> "$GITHUB_OUTPUT"
          else
            echo 'pins-changed=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Attest exact-head Lake configuration before executing Lake
        id: attest
        run: |
          bash gate/scripts/attest-pr-config.sh \
            base head '${{ steps.pr.outputs.sha }}' '${{ github.event_name }}' 1 \
            '${{ steps.config.outputs.pins-changed }}'

      - name: Validate an optional forward Lake-pin bump
        id: bump
        if: ${{ steps.config.outputs.pins-changed == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash gate/scripts/check-bump.sh policy base head

      - name: Prepare safe performance manifest (trusted)
        id: manifest
        run: |
          set -euo pipefail
          if [ '${{ steps.config.outputs.pins-changed }}' = 1 ]; then
            # Cross-toolchain/module-cost ratios do not compare like with like. pr-build remains
            # the required watchdog-backed compilation; this workflow records an advisory skip.
            printf '[]\n' > "$RUNNER_TEMP/perf-manifest.json"
            count=0
            echo 'skipped=pins' >> "$GITHUB_OUTPUT"
            printf '%s\n' \
              '<!-- lean-performance-comment -->' \
              '## Lean performance' \
              '' \
              'Performance ratios were not compared because this PR changes the Mathlib and/or Lean' \
              'pin. The required exact-head build still compiles under the universal Lean watchdog.' \
              > performance.md
          else
            python3 gate/scripts/perf/manifest.py \
              --files "$RUNNER_TEMP/files.json" --base base --head head \
              --output "$RUNNER_TEMP/perf-manifest.json"
            count=$(jq '[.[] | select(.kind != "removed")] | length' "$RUNNER_TEMP/perf-manifest.json")
            echo 'skipped=' >> "$GITHUB_OUTPUT"
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '[]\n' > "$RUNNER_TEMP/base-results.json"
          printf '[]\n' > "$RUNNER_TEMP/head-results.json"

      # Pinned leanprover/elan release, verified by SHA-256. Like bwrap below it is installed
      # in the trusted phase, before anything confines the PR's code, and it chooses the `lake`
      # that later runs inside that confinement. scripts/test_elan_pin.py keeps the copies honest.
      - name: Install elan (trusted, pinned + checksum)
        if: ${{ steps.manifest.outputs.count != '0' }}
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install bubblewrap (pinned + checksum) and self-test (fail closed)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          # Pinned Ubuntu package, verified twice: the .deb that was fetched, and the binary it
          # installed. A bare `apt-get install bubblewrap` would take whatever the archive holds on
          # the day, which is not a pin.
          #
          # Noble's RELEASE pocket, which is the part of the archive Ubuntu never rewrites: a
          # version published there stays published for the life of the release. The pocket
          # matters more than the suite. `0.9.0-1ubuntu0.1` in noble-security looks like the
          # better package, but security and updates entries are superseded and then deleted
          # when the next one lands, so pinning that would expire the first time Ubuntu ships a
          # bubblewrap fix. A development suite is worse again, deleted on the next upload.
          #
          # What we give up is the noble-security revision, whose only change is a backport
          # Flatpak needed for CVE-2024-42472. That is an enabling change for Flatpak rather
          # than a bubblewrap vulnerability fix, and nothing here uses Flatpak.
          #
          # 0.9.0 predates the fix for GHSA-pxhw-h44j-8pfx (2026-08-27, no CVE assigned yet),
          # where a symlink in attacker-controlled content redirects the files bwrap creates
          # while setting the sandbox up. That reaches these policies through exactly one path:
          # `.lake`, the only place they create a mount point inside a candidate checkout. The
          # "Normalise ... .lake" step above replaces it with a real directory before anything
          # reads or writes it, which removes the precondition rather than patching the symptom,
          # and closes the same hole for `mkdir -p` and the cache restore, neither of which the
          # upstream fix would have covered.
          #
          # So this pin is safe because of that step, not because 0.9.0 is fixed. Moving to
          # 0.12.0 when noble carries it would make the sandbox safe on its own and retire that
          # half of the step's job; the trusted-phase half stays either way. Until then the step
          # is load-bearing, and scripts/test_bwrap_pin.py checks it is still present and still
          # runs before anything that touches a candidate `.lake`.
          deb="bubblewrap_${BWRAP_VER}_amd64.deb"
          if ! curl -sSL --fail "https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/${deb}" -o bwrap.deb \
             && ! curl -sSL --fail "https://security.ubuntu.com/ubuntu/pool/main/b/bubblewrap/${deb}" -o bwrap.deb; then
            echo "::error::bubblewrap ${BWRAP_VER} is gone from the Ubuntu pool. The sandbox cannot be installed, so no PR can build until the pin is moved."
            printf '%s\n' \
              '' \
              "WHAT HAPPENED: BWRAP_VER is pinned to ${BWRAP_VER} from noble's release pocket," \
              'which Ubuntu does not rewrite for the life of the release. Reaching this is' \
              'unexpected: an archive outage, a runner image no longer on 24.04, or 24.04 gone' \
              'end of life.' \
              '' \
              'HOW TO FIX IT. Take the version from a RELEASE pocket, never from -updates,' \
              '-security or a development suite: those are superseded and deleted, so a pin' \
              'to one expires and brings every required build down with it.' \
              '' \
              '  suite=noble        # or the release pocket of whatever image CI runs on' \
              '  curl -s "https://archive.ubuntu.com/ubuntu/dists/$suite/main/binary-amd64/Packages.gz" \' \
              "    | gunzip | awk '/^Package: bubblewrap\$/{f=1} f&&/^Version:/{print \$2; exit}'" \
              '' \
              'Download it and take both hashes:' \
              '' \
              '  curl -sSLO "https://archive.ubuntu.com/ubuntu/pool/main/b/bubblewrap/bubblewrap_${ver}_amd64.deb"' \
              '  sha256sum "bubblewrap_${ver}_amd64.deb"   # BWRAP_DEB_SHA256' \
              '  sudo dpkg -i "bubblewrap_${ver}_amd64.deb"' \
              '  sha256sum /usr/bin/bwrap                  # BWRAP_SHA256' \
              '' \
              'Set BWRAP_VER, BWRAP_DEB_SHA256 and BWRAP_SHA256 in all three of' \
              '.github/workflows/{pr-build,pr-profile,nightly-verify}.yml. They must agree;' \
              'scripts/test_bwrap_pin.py fails if they do not.' \
              '' \
              'ON VERSIONS: 0.12.0 or newer is safe on its own. Below that, the' \
              '"Normalise ... .lake" step is what keeps it safe, because earlier bubblewrap' \
              'follows a symlink in a candidate checkout while creating the sandbox mount point' \
              '(GHSA-pxhw-h44j-8pfx). If you pin below 0.12.0, check that step still runs before' \
              'anything else touches .lake. Keep the step either way: the trusted-phase callers' \
              'follow the symlink themselves and no bubblewrap version fixes that.' \
              '' >&2
            exit 1
          fi
          if ! echo "${BWRAP_DEB_SHA256}  bwrap.deb" | sha256sum -c -; then
            echo "::error::bubblewrap ${BWRAP_VER} downloaded but does not match BWRAP_DEB_SHA256. Ubuntu does not rewrite published packages, so either the pin is wrong or the download was tampered with. Re-derive the hashes rather than relaxing this check."
            exit 1
          fi
          sudo dpkg -i bwrap.deb >/dev/null
          if ! echo "${BWRAP_SHA256}  /usr/bin/bwrap" | sha256sum -c -; then
            echo "::error::the installed /usr/bin/bwrap does not match BWRAP_SHA256, so the binary that would run is not the one that was vetted. Re-derive it with: sudo dpkg -i ${deb} && sha256sum /usr/bin/bwrap"
            exit 1
          fi
          rm -f bwrap.deb
          /usr/bin/bwrap --version

          # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor, so bwrap cannot build
          # its sandbox as shipped. Grant the capability to this one binary rather than clearing
          # kernel.apparmor_restrict_unprivileged_userns, which would lift it for everything on the
          # runner. Measured on ubuntu-24.04: without this, bwrap fails with
          # "loopback: Failed RTM_NEWADDR: Operation not permitted".
          printf '%s\n' \
            'abi <abi/4.0>,' \
            'include <tunables/global>' \
            'profile bwrap /usr/bin/bwrap flags=(unconfined) {' \
            '  userns,' \
            '  include if exists <local/bwrap>' \
            '}' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/bwrap

          # Prove the sandbox enforces before trusting it with candidate code. bwrap fails closed
          # where landrun's --best-effort could degrade to no sandbox at all, but `--unshare-all`
          # expands to `--unshare-user-try`, which SKIPS the user namespace rather than failing
          # when it cannot be created, so the policies name `--unshare-user` explicitly and this
          # compares the resulting namespace against the host's.
          #
          # `env -i`: `--clearenv` clears the CHILD's environment, but bwrap keeps its own and is
          # PID 1 of the sandbox's PID namespace, so without this the launcher's environment stays
          # readable at /proc/1/environ from inside (containers/bubblewrap#725).
          probe() {
            env -i /usr/bin/bwrap --tmpfs / --ro-bind /usr /usr --ro-bind /etc /etc \
              --symlink usr/bin /bin --symlink usr/sbin /sbin \
              --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
              --dev /dev --proc /proc --tmpfs /tmp --remount-ro / \
              --setenv PATH /usr/bin \
              --unshare-user --unshare-ipc --unshare-pid --unshare-net --unshare-uts \
              --unshare-cgroup --disable-userns --die-with-parent --new-session \
              -- /usr/bin/bash -c "$1"
          }
          # Canaries, so each check can fail for the right reason. Testing that a host path is
          # merely absent proves nothing if it never existed; these are known to exist outside.
          canary=$(mktemp -d); echo secret > "$canary/file"
          echo secret > /dev/shm/bwrap-host-canary-$$
          set +e
          probe 'echo ok' >/dev/null 2>&1; ok=$?
          probe 'echo x > /etc/bwrap-probe' >/dev/null 2>&1; wr=$?
          probe 'mkdir /bwrap-probe-dir' >/dev/null 2>&1; rootw=$?
          probe "cat $canary/file" >/dev/null 2>&1; hostro=$?
          probe "cat /dev/shm/bwrap-host-canary-$$" >/dev/null 2>&1; shm=$?
          probe 'curl -sS --max-time 8 https://example.com >/dev/null' >/dev/null 2>&1; net=$?
          probe 'unshare --user --map-root-user true' >/dev/null 2>&1; nest=$?
          host_ns=$(readlink /proc/self/ns/user)
          sb_ns=$(probe 'readlink /proc/self/ns/user' 2>/dev/null)
          sb_env=$(probe 'tr "\0" "\n" < /proc/1/environ | grep -c .' 2>/dev/null)
          set -e
          rm -rf "$canary" /dev/shm/bwrap-host-canary-$$
          echo "self-test: run=$ok etc-write=$wr root-write=$rootw host-read=$hostro shm=$shm" \
            "net=$net nested-userns=$nest pid1-env=$sb_env userns=$host_ns->$sb_ns"
          # Every one of these but `ok` must FAIL inside the sandbox.
          if [ "$ok" -ne 0 ] || [ "$wr" -eq 0 ] || [ "$rootw" -eq 0 ] || [ "$hostro" -eq 0 ] \
             || [ "$shm" -eq 0 ] || [ "$net" -eq 0 ] || [ "$nest" -eq 0 ] \
             || [ "$sb_env" != "0" ] || [ -z "$sb_ns" ] || [ "$sb_ns" = "$host_ns" ]; then
            echo "::error::bwrap not enforcing (run=$ok etc-write=$wr root-write=$rootw" \
              "host-read=$hostro shm=$shm net=$net nested-userns=$nest pid1-env=$sb_env" \
              "userns=$host_ns->$sb_ns); refusing to run candidate code"
            exit 1
          fi

      - name: Select and prove the host performance metric before candidate code
        id: metric
        if: ${{ steps.config.outputs.pins-changed != '1' }}
        run: |
          set -euo pipefail
          if perf stat -j -e instructions:u -o "$RUNNER_TEMP/perf-probe.json" -- true \
               2>"$RUNNER_TEMP/perf-probe.err" \
             && ! grep -Eq 'not supported|not counted|<not' "$RUNNER_TEMP/perf-probe.json"; then
            mode=instructions
            echo '::notice::using retired hardware instructions'
          else
            mode=cpu
            /usr/bin/time --quiet \
              --format '{"user_seconds":%U,"system_seconds":%S,"wall_seconds":%e}' \
              --output "$RUNNER_TEMP/cpu-probe.json" -- true
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert float(d["user_seconds"]) >= 0 and float(d["system_seconds"]) >= 0' \
              "$RUNNER_TEMP/cpu-probe.json"
            echo '::notice::retired instructions unavailable; using same-runner CPU time'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Fetch immutable-base Mathlib oleans (network, no candidate code)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -o pipefail
          ( cd base && lake exe cache get ) 2>&1 | tee "$RUNNER_TEMP/base-cache.log"
          mkdir -p base/.lake/tmp

      - name: Fetch immutable-base Tau Ceti oleans through the shared cache client
        id: tauceti_cache
        if: ${{ steps.manifest.outputs.count != '0' }}
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          # The same limit as pr-build, for the same shared script. This step reads the
          # comparison base, which main publishes, so the search stops at the first lookup.
          LAKE_CACHE_MAX_REVS: "100"
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_ARTIFACT_ENDPOINT" ] || [ -z "$PUBLIC_REVISION_ENDPOINT" ]; then
            echo 'enabled=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export LAKE_CACHE_DIR="$PWD/base/.lake/cache"
          bash gate/scripts/lake-cache-get.sh base
          if [ -d "$LAKE_CACHE_DIR/artifacts" ]; then
            {
              echo 'enabled=1'
              echo "dir=$LAKE_CACHE_DIR"
            } >> "$GITHUB_OUTPUT"
            {
              echo 'LAKE_ARTIFACT_CACHE=true'
              echo 'LAKE_RESTORE_ARTIFACTS=true'
              echo "LAKE_CACHE_DIR=$LAKE_CACHE_DIR"
            } >> "$GITHUB_ENV"
          else
            echo 'enabled=0' >> "$GITHUB_OUTPUT"
            echo '::warning::Tau Ceti artifact cache unavailable; measuring from source'
          fi

      - name: Prepare immutable-base read-only Lean watchdog toolchain
        id: base_watchdog
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd base && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-base"
          bash gate/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "path=$watchdog" >> "$GITHUB_OUTPUT"

      # Host perf owns RUNNER_TEMP and wraps bwrap. The raw files are not bound
      # into the sandbox, while all Lean/Lake execution is inside it.
      - name: Measure base modules (host metric around offline bwrap sandbox)
        id: base_perf
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 gate/scripts/perf/measure.py --root base \
            --watchdog-toolchain '${{ steps.base_watchdog.outputs.path }}' \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" --side base \
            --raw-dir "$RUNNER_TEMP/perf-raw/base" \
            --output "$RUNNER_TEMP/base-results.json"

      - name: Prepare isolated head build state (trusted)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          rm -rf head/.lake
          # Pin-changing comparisons are skipped above, so the attested exact head and base use
          # the same Lake configuration. Base measurements are complete and base/.lake is never
          # executed again. A hardlink clone reuses its public artifact set without a multi-minute
          # copy; candidate writes cannot reach trusted scripts or raw base results in RUNNER_TEMP.
          cp -al base/.lake head/.lake
          if [ '${{ steps.tauceti_cache.outputs.enabled }}' = 1 ]; then
            echo "LAKE_CACHE_DIR=$PWD/head/.lake/cache" >> "$GITHUB_ENV"
          fi

      - name: Prepare candidate read-only Lean watchdog toolchain
        id: head_watchdog
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd head && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-head"
          bash gate/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "path=$watchdog" >> "$GITHUB_OUTPUT"

      # Prepare these writable sandbox inputs before any candidate code runs in
      # head/.lake. They are advisory only; after measurement their logs are
      # copied out with O_NOFOLLOW before the trusted renderer reads them.
      - name: Prepare advisory heartbeat sources (trusted)
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/manifest.py \
            --files "$RUNNER_TEMP/files.json" --base base --head head \
            --output "$RUNNER_TEMP/perf-manifest.json" \
            --heartbeat-dir head/.lake/tmp/profile

      - name: Measure head modules (host metric around offline bwrap sandbox)
        id: head_perf
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          python3 gate/scripts/perf/measure.py --root head \
            --watchdog-toolchain '${{ steps.head_watchdog.outputs.path }}' \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" --side head \
            --raw-dir "$RUNNER_TEMP/perf-raw/head" \
            --output "$RUNNER_TEMP/head-results.json"

      - name: Evaluate required performance budgets (trusted, fail closed)
        id: report
        if: ${{ steps.config.outputs.pins-changed != '1' }}
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/report.py \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" \
            --base "$RUNNER_TEMP/base-results.json" \
            --head "$RUNNER_TEMP/head-results.json" \
            --output performance.md \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      # Advisory heartbeat profile remains available, but it has no bearing on
      # the required perf status. It executes under the same bwrap + watchdog.
      - name: Measure advisory heartbeats (bwrap, offline)
        id: heartbeats
        if: ${{ steps.manifest.outputs.count != '0' && steps.head_perf.outcome == 'success' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
          WATCHDOG_TOOLCHAIN: ${{ steps.head_watchdog.outputs.path }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          # `env -i` and `--remount-ro /` are both load-bearing. `--clearenv` clears the child's
          # environment but bwrap keeps its own and is PID 1 here, so the launcher's environment
          # would otherwise be readable at /proc/1/environ (containers/bubblewrap#725). And
          # `--tmpfs /` gives a WRITABLE synthetic root: the directories bwrap creates to hang the
          # binds off, $HOME among them, are writable until this remounts them read-only, which
          # would let candidate code drop a `lake` or `bash` earlier on PATH than the real one and
          # have the later audits run it. The explicit PATH below is the other half of that: it
          # never contains a directory the sandbox can write.
          env -i /usr/bin/bwrap --tmpfs / \
            --ro-bind /usr /usr --ro-bind /etc /etc \
            --symlink usr/bin /bin --symlink usr/sbin /sbin \
            --symlink usr/lib /lib --symlink usr/lib64 /lib64 \
            --dev /dev --proc /proc --tmpfs /tmp \
            --ro-bind "$HOME/.elan" "$HOME/.elan" \
            --ro-bind "$WATCHDOG_TOOLCHAIN" "$WATCHDOG_TOOLCHAIN" \
            --ro-bind "$PWD/gate" "$PWD/gate" \
            --ro-bind "$PWD/head" "$PWD/head" --bind "$PWD/head/.lake" "$PWD/head/.lake" \
            --remount-ro / \
            --setenv PATH "$HOME/.elan/bin:/usr/bin:/bin" \
            --setenv HOME "$HOME" --setenv CI "${CI:-}" \
            --setenv LAKE_NO_CACHE "${LAKE_NO_CACHE:-}" \
            --setenv WATCHDOG_TOOLCHAIN "${WATCHDOG_TOOLCHAIN:-}" \
            --chdir "$PWD/head" \
            --unshare-user --unshare-ipc --unshare-pid --unshare-net --unshare-uts \
            --unshare-cgroup --disable-userns --die-with-parent --new-session \
            -- bash -euo pipefail -c 'exec bash ../gate/scripts/profile/measure.sh .lake/tmp/profile'

      - name: Safely collect heartbeat logs from the untrusted writable tree
        id: collect_heartbeats
        if: ${{ steps.heartbeats.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/collect_heartbeats.py \
            --lake-root head/.lake --manifest "$RUNNER_TEMP/perf-manifest.json" \
            --output "$RUNNER_TEMP/collected-profile"

      - name: Render advisory heartbeat profile (trusted)
        if: ${{ steps.collect_heartbeats.outcome == 'success' }}
        continue-on-error: true
        env:
          PREP: ${{ runner.temp }}/collected-profile
          OUTPUT: ${{ github.workspace }}/profile.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 gate/scripts/profile/render.py

      - name: Post or update performance and heartbeat comments
        if: ${{ always() && steps.pr.outputs.num != 'merge-group' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          update_comment() {
            local marker="$1" file="$2" existing
            [ -r "$file" ] || return 0
            existing=$(gh api "repos/${{ github.repository }}/issues/$NUM/comments" --paginate \
              --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")
            if [ -n "$existing" ]; then
              jq -n --rawfile body "$file" '{body: $body}' \
                | gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" --input -
            else
              gh pr comment "$NUM" --repo '${{ github.repository }}' --body-file "$file"
            fi
          }
          update_comment '<!-- lean-performance-comment -->' performance.md
          update_comment '<!-- proof-profile-comment -->' profile.md

      - name: Post terminal required perf status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.status_sha }}
          FILE_COUNT: ${{ steps.manifest.outputs.count }}
          ATTEST_OUTCOME: ${{ steps.attest.outcome }}
          PINS_CHANGED: ${{ steps.config.outputs.pins-changed }}
          BUMP_OUTCOME: ${{ steps.bump.outcome }}
          BASE_OUTCOME: ${{ steps.base_perf.outcome }}
          HEAD_OUTCOME: ${{ steps.head_perf.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          METRIC: ${{ steps.metric.outputs.mode }}
        run: |
          set -uo pipefail
          if [ "$ATTEST_OUTCOME" != success ]; then
            state=failure
            description='exact-head Lake configuration attestation failed'
          elif [ "$PINS_CHANGED" = 1 ] && [ "$BUMP_OUTCOME" = success ]; then
            state=success
            description='validated pin/toolchain bump; cost ratio intentionally skipped'
          elif [ "$PINS_CHANGED" = 1 ]; then
            state=failure
            description='Lake pin change failed trusted forward-bump validation'
          elif [ "$FILE_COUNT" = 0 ] && [ "$REPORT_OUTCOME" = success ]; then
            state=success
            description='no added or modified TauCeti Lean files'
          elif [ "$BASE_OUTCOME" = success ] && [ "$HEAD_OUTCOME" = success ] && [ "$REPORT_OUTCOME" = success ]; then
            state=success
            description="wall-time and $METRIC budgets passed"
          else
            state=failure
            description='Lean performance gate failed (see run and report)'
          fi
          posted=0
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$state" -f context=perf -f description="$description" \
              -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'; then
              posted=1
              break
            fi
            [ "$attempt" = 3 ] || sleep $((attempt * 5))
          done
          [ "$posted" = 1 ] || { echo '::error::could not post terminal perf status'; exit 1; }
          [ "$state" = success ]
