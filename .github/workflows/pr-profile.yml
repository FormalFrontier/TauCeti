name: pr-performance

# Required, base-branch-defined performance gate for untrusted Lean changes.
#
# Security boundary: GitHub/API resolution, perf, threshold evaluation, status
# posting, and report rendering run as trusted host steps. The PR contributes
# only TauCeti/ sources (plus forward-bump-validated pins). Every command that
# can elaborate those sources runs offline under landrun with the same mounts
# and environment allowlist as pr-build. Host perf wraps the landrun process;
# its raw counter files live in RUNNER_TEMP, which is not mounted in landrun, so
# PR code cannot forge or erase its measurements. No token enters the sandbox.
#
# The required `perf` commit status is separate from the advisory heartbeat
# profile. It uses retired instructions when the runner exposes them and a
# same-runner CPU-time comparison otherwise. Every Lean process also has the
# universal 300-second watchdog installed by scripts/perf/lean-watchdog.sh.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to profile", required: true, type: string }

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: >-
    ${{
      (github.event_name == 'pull_request_target' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/profile')))
      && format('pr-performance-{0}',
           github.event.pull_request.number || github.event.issue.number ||
           inputs.pr || github.event.merge_group.head_sha)
      || format('pr-performance-noop-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  # Deliberately not named `perf`: the authoritative required context is the
  # commit status posted at the end, not this workflow's automatic check-run.
  performance-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    if: >-
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/profile') &&
       (github.event.comment.user.login == github.event.issue.user.login ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)))
    env:
      LANDRUN_SHA256: 645178e3239cd33760560834e50efea0864183a2a8a82faf199760dffee6dd71
      LANDRUN_VER: v0.1.14
      LAKE_ARTIFACT_CACHE: ""
      LAKE_RESTORE_ARTIFACTS: ""
      LAKE_CACHE_DIR: ""
    steps:
      # --- Trusted setup. No PR code runs before the landrun measurement steps. ---
      - name: Resolve immutable base and head commits
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case '${{ github.event_name }}' in
            merge_group)
              NUM=merge-group
              SHA='${{ github.event.merge_group.head_sha }}'
              HEAD_REPO="$TARGET_REPO"
              BASE_SHA='${{ github.event.merge_group.base_sha }}'
              STATUS_SHA="$SHA"
              AUTHOR=''
              MB="$BASE_SHA"
              ;;
            pull_request_target)
              NUM='${{ github.event.pull_request.number }}'
              SHA='${{ github.event.pull_request.head.sha }}'
              HEAD_REPO='${{ github.event.pull_request.head.repo.full_name }}'
              BASE_SHA='${{ github.event.pull_request.base.sha }}'
              STATUS_SHA="$SHA"
              AUTHOR='${{ github.event.pull_request.user.login }}'
              ;;
            issue_comment)
              NUM='${{ github.event.issue.number }}'
              ;;
            workflow_dispatch)
              NUM='${{ inputs.pr }}'
              ;;
          esac
          if [ '${{ github.event_name }}' = issue_comment ] || [ '${{ github.event_name }}' = workflow_dispatch ]; then
            data=$(gh api "repos/$TARGET_REPO/pulls/$NUM")
            SHA=$(jq -r .head.sha <<<"$data")
            HEAD_REPO=$(jq -r .head.repo.full_name <<<"$data")
            BASE_SHA=$(jq -r .base.sha <<<"$data")
            STATUS_SHA="$SHA"
            AUTHOR=$(jq -r .user.login <<<"$data")
          fi
          if [ -z "${MB:-}" ]; then
            OWNER="${HEAD_REPO%%/*}"
            MB=$(gh api "repos/$TARGET_REPO/compare/$BASE_SHA...$OWNER:$SHA" \
              --jq .merge_base_commit.sha)
          fi
          {
            echo "num=$NUM"
            echo "sha=$SHA"
            echo "head_repo=$HEAD_REPO"
            echo "base_sha=$BASE_SHA"
            echo "status_sha=$STATUS_SHA"
            echo "mergebase=$MB"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          echo "Performance gate for $NUM: $BASE_SHA -> $SHA (merge-base $MB)"

      - name: Post pending perf status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.status_sha }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
            -f state=pending -f context=perf \
            -f description='measuring Lean wall time and module cost' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Fetch trusted changed-file metadata
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.pr.outputs.num }}
          BASE: ${{ steps.pr.outputs.base_sha }}
          HEAD: ${{ steps.pr.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$NUM" = merge-group ]; then
            gh api "repos/${{ github.repository }}/compare/$BASE...$HEAD" --jq .files > "$RUNNER_TEMP/files.json"
            count=$(jq length "$RUNNER_TEMP/files.json")
            if [ "$count" -ge 300 ]; then
              echo "::error::merge-group changed-file list hit GitHub's 300-file compare cap; failing closed"
              exit 1
            fi
          else
            gh api --paginate --slurp \
              "repos/${{ github.repository }}/pulls/$NUM/files?per_page=100" > "$RUNNER_TEMP/file-pages.json"
            jq '[.[][]]' "$RUNNER_TEMP/file-pages.json" > "$RUNNER_TEMP/files.json"
          fi

      - name: Checkout workflow-pinned trusted tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout immutable base (trusted)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base
          persist-credentials: false
          fetch-depth: 100

      - name: Checkout base again for the head overlay (trusted config)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: head
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout merge-base config (trusted ancestor)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.mergebase }}
          path: mergebase
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout candidate head (untrusted, no credentials)
        uses: actions/checkout@v4
        with:
          # pull_request_target intentionally fetches untrusted source for a
          # data-only overlay; it is executed only later, offline in landrun.
          allow-unsafe-pr-checkout: true
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false

      - name: Stage workflow-pinned performance tooling into trusted trees
        run: |
          set -euo pipefail
          for tree in base head; do
            rm -rf "$tree/scripts/perf"
            cp -a gate/scripts/perf "$tree/scripts/perf"
            cp -a gate/scripts/profile/measure.sh "$tree/scripts/profile/measure.sh"
            cp -a gate/scripts/profile/render.py "$tree/scripts/profile/render.py"
          done

      - name: Validate optional Lake-pin bump with trusted base validator
        id: pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if jq -e '.[] | select(.filename == "lakefile.toml" or .filename == "lakefile.lean")' \
               "$RUNNER_TEMP/files.json" >/dev/null; then
            # Lakefiles are human-owned and are never executed here. Measure
            # any TauCeti/ delta against the trusted base config, as pr-build does.
            echo 'changed=0' >> "$GITHUB_OUTPUT"
            echo '::notice::candidate changes a human-owned lakefile; performance uses trusted base config'
          elif jq -e '.[] | select(.filename == "lake-manifest.json" or .filename == "lean-toolchain")' \
               "$RUNNER_TEMP/files.json" >/dev/null; then
            echo 'changed=1' >> "$GITHUB_OUTPUT"
            bash base/scripts/check-bump.sh base mergebase pr
          else
            echo 'changed=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Overlay only candidate TauCeti sources and validated pins
        run: |
          set -euo pipefail
          if find pr/TauCeti -type l -print | grep -q .; then
            echo '::error::symlinks are not allowed under TauCeti/'
            exit 1
          fi
          test -d pr/TauCeti && test ! -L pr/TauCeti
          rm -rf head/TauCeti
          cp -a pr/TauCeti head/TauCeti
          if [ -e pr/TauCeti.lean ]; then
            test ! -L pr/TauCeti.lean
            cp -a pr/TauCeti.lean head/TauCeti.lean
          fi
          if [ '${{ steps.pins.outputs.changed }}' = 1 ]; then
            for file in lake-manifest.json lean-toolchain; do
              test ! -L "pr/$file"
              [ ! -e "pr/$file" ] || cp -a "pr/$file" "head/$file"
            done
          fi

      - name: Prepare safe performance manifest (trusted)
        id: manifest
        run: |
          set -euo pipefail
          python3 gate/scripts/perf/manifest.py \
            --files "$RUNNER_TEMP/files.json" --base base --head head \
            --output "$RUNNER_TEMP/perf-manifest.json"
          count=$(jq '[.[] | select(.kind != "removed")] | length' "$RUNNER_TEMP/perf-manifest.json")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          printf '[]\n' > "$RUNNER_TEMP/base-results.json"
          printf '[]\n' > "$RUNNER_TEMP/head-results.json"

      # Pinned leanprover/elan release, verified by SHA-256. Like landrun below it is installed
      # in the trusted phase, before anything confines the PR's code, and it chooses the `lake`
      # that later runs inside that confinement. scripts/test_elan_pin.py keeps the copies honest.
      - name: Install elan (trusted, pinned + checksum)
        if: ${{ steps.manifest.outputs.count != '0' }}
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install landrun and prove confinement (trusted, fail closed)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          curl -sSL -H 'Accept: application/octet-stream' \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VER}/landrun-linux-amd64" -o landrun
          echo "${LANDRUN_SHA256}  landrun" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          install -m 0755 landrun "$HOME/.local/bin/landrun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          set +e
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo ok' >/dev/null 2>&1; ok=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /etc/landrun-probe' >/dev/null 2>&1; wr=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /dev/shm/landrun-probe' >/dev/null 2>&1; shm=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'curl -sS --max-time 8 https://example.com >/dev/null' >/dev/null 2>&1; net=$?
          set -e
          echo "self-test: run=$ok write=$wr shm=$shm net=$net"
          if [ "$ok" -ne 0 ] || [ "$wr" -eq 0 ] || [ "$shm" -eq 0 ] || [ "$net" -eq 0 ]; then
            echo '::error::landrun did not enforce; refusing to run candidate code'
            exit 1
          fi

      - name: Select and prove the host performance metric before candidate code
        id: metric
        run: |
          set -euo pipefail
          if perf stat -j -e instructions:u -o "$RUNNER_TEMP/perf-probe.json" -- true \
               2>"$RUNNER_TEMP/perf-probe.err" \
             && ! grep -Eq 'not supported|not counted|<not' "$RUNNER_TEMP/perf-probe.json"; then
            mode=instructions
            echo '::notice::using retired hardware instructions'
          else
            mode=cpu
            /usr/bin/time --quiet \
              --format '{"user_seconds":%U,"system_seconds":%S,"wall_seconds":%e}' \
              --output "$RUNNER_TEMP/cpu-probe.json" -- true
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert float(d["user_seconds"]) >= 0 and float(d["system_seconds"]) >= 0' \
              "$RUNNER_TEMP/cpu-probe.json"
            echo '::notice::retired instructions unavailable; using same-runner CPU time'
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Fetch immutable-base Mathlib oleans (network, no candidate code)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -o pipefail
          ( cd base && lake exe cache get ) 2>&1 | tee "$RUNNER_TEMP/base-cache.log"
          mkdir -p base/.lake/tmp

      - name: Fetch immutable-base Tau Ceti oleans (network, no candidate code)
        id: tauceti_cache
        if: ${{ steps.manifest.outputs.count != '0' }}
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_ARTIFACT_ENDPOINT" ] || [ -z "$PUBLIC_REVISION_ENDPOINT" ]; then
            echo 'enabled=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          config="$RUNNER_TEMP/lake-cache.toml"
          cat > "$config" <<TOML
          cache.defaultService = "tauceti-public"
          [[cache.service]]
          name = "tauceti-public"
          kind = "s3"
          artifactEndpoint = "$PUBLIC_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$PUBLIC_REVISION_ENDPOINT"
          TOML
          cache_dir="$PWD/base/.lake/cache"
          fail_re='failed to download|output lookup failed|curl exited with code|downloaded artifact hash mismatch'
          discard_cache() {
            [ -e "$cache_dir" ] || return 0
            if mv "$cache_dir" "$cache_dir.discard.$$" 2>/dev/null; then
              rm -rf "$cache_dir.discard.$$" 2>/dev/null || true
            else
              rm -rf "$cache_dir" 2>/dev/null || true
            fi
            return 0
          }
          clean=0
          for attempt in 1 2 3 4 5 6; do
            discard_cache
            log="$RUNNER_TEMP/tauceti-cache-$attempt.log"
            rc=0
            ( cd base && LAKE_CONFIG="$config" LAKE_CACHE_DIR="$cache_dir" \
                lake cache get --service tauceti-public --repo TauCetiProject/TauCeti ) \
                >"$log" 2>&1 || rc=$?
            cat "$log"
            if [ "$rc" = 0 ] && ! grep -qE "$fail_re" "$log"; then
              clean=1
              break
            fi
            [ "$attempt" = 6 ] || sleep 10
          done
          if [ "$clean" = 1 ]; then
            {
              echo 'enabled=1'
              echo "dir=$cache_dir"
            } >> "$GITHUB_OUTPUT"
            {
              echo 'LAKE_ARTIFACT_CACHE=true'
              echo 'LAKE_RESTORE_ARTIFACTS=true'
              echo "LAKE_CACHE_DIR=$cache_dir"
            } >> "$GITHUB_ENV"
          else
            discard_cache
            echo 'enabled=0' >> "$GITHUB_OUTPUT"
            echo '::warning::Tau Ceti artifact cache unavailable; measuring from source'
          fi

      - name: Prepare immutable-base read-only Lean watchdog toolchain
        id: base_watchdog
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd base && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-base"
          bash gate/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "path=$watchdog" >> "$GITHUB_OUTPUT"

      # Host perf owns RUNNER_TEMP and wraps landrun. The raw files are not in
      # any landrun mount, while all Lean/Lake execution is inside landrun.
      - name: Measure base modules (host metric around offline landrun)
        id: base_perf
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          python3 gate/scripts/perf/measure.py --root base \
            --watchdog-toolchain '${{ steps.base_watchdog.outputs.path }}' \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" --side base \
            --raw-dir "$RUNNER_TEMP/perf-raw/base" \
            --output "$RUNNER_TEMP/base-results.json"

      - name: Prepare isolated head build state (trusted)
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          rm -rf head/.lake
          if [ '${{ steps.pins.outputs.changed }}' = 1 ]; then
            ( cd head && lake exe cache get ) 2>&1 | tee "$RUNNER_TEMP/head-cache.log"
            mkdir -p head/.lake/tmp
            {
              echo 'LAKE_ARTIFACT_CACHE=false'
              echo 'LAKE_RESTORE_ARTIFACTS=false'
              echo 'LAKE_CACHE_DIR='
            } >> "$GITHUB_ENV"
          else
            # Base measurements are complete and base/.lake is never trusted or
            # executed again. A hardlink clone therefore reuses its large public
            # artifact set without a multi-minute copy. Candidate writes may
            # affect those retired base-cache inodes, but cannot reach the raw
            # base result in RUNNER_TEMP or any trusted scripts/config.
            cp -al base/.lake head/.lake
            if [ '${{ steps.tauceti_cache.outputs.enabled }}' = 1 ]; then
              echo "LAKE_CACHE_DIR=$PWD/head/.lake/cache" >> "$GITHUB_ENV"
            fi
          fi

      - name: Prepare candidate read-only Lean watchdog toolchain
        id: head_watchdog
        if: ${{ steps.manifest.outputs.count != '0' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd head && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-head"
          bash gate/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "path=$watchdog" >> "$GITHUB_OUTPUT"

      # Prepare these writable sandbox inputs before any candidate code runs in
      # head/.lake. They are advisory only; after measurement their logs are
      # copied out with O_NOFOLLOW before the trusted renderer reads them.
      - name: Prepare advisory heartbeat sources (trusted)
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/manifest.py \
            --files "$RUNNER_TEMP/files.json" --base base --head head \
            --output "$RUNNER_TEMP/perf-manifest.json" \
            --heartbeat-dir head/.lake/tmp/profile

      - name: Measure head modules (host metric around offline landrun)
        id: head_perf
        if: ${{ steps.manifest.outputs.count != '0' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          python3 gate/scripts/perf/measure.py --root head \
            --watchdog-toolchain '${{ steps.head_watchdog.outputs.path }}' \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" --side head \
            --raw-dir "$RUNNER_TEMP/perf-raw/head" \
            --output "$RUNNER_TEMP/head-results.json"

      - name: Evaluate required performance budgets (trusted, fail closed)
        id: report
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/report.py \
            --metric '${{ steps.metric.outputs.mode }}' \
            --manifest "$RUNNER_TEMP/perf-manifest.json" \
            --base "$RUNNER_TEMP/base-results.json" \
            --head "$RUNNER_TEMP/head-results.json" \
            --output performance.md \
            --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      # Advisory heartbeat profile remains available, but it has no bearing on
      # the required perf status. It executes under the same landrun + watchdog.
      - name: Measure advisory heartbeats (landrun, offline)
        id: heartbeats
        if: ${{ steps.manifest.outputs.count != '0' && steps.head_perf.outcome == 'success' }}
        continue-on-error: true
        env:
          LAKE_NO_CACHE: 'true'
          WATCHDOG_TOOLCHAIN: ${{ steps.head_watchdog.outputs.path }}
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          landrun --rox /usr --rox /etc \
            --rw /dev/null --rox /dev/zero --rox /dev/urandom --rox /dev/random \
            --rox "$HOME/.elan" --rox "$WATCHDOG_TOOLCHAIN" \
            --rox "$PWD/head" --rw "$PWD/head/.lake" \
            --env PATH --env HOME --env CI --env LAKE_NO_CACHE --env WATCHDOG_TOOLCHAIN \
            -- bash -euo pipefail -c 'cd head && exec bash scripts/profile/measure.sh .lake/tmp/profile'

      - name: Safely collect heartbeat logs from the untrusted writable tree
        id: collect_heartbeats
        if: ${{ steps.heartbeats.outcome == 'success' }}
        continue-on-error: true
        run: |
          python3 gate/scripts/perf/collect_heartbeats.py \
            --lake-root head/.lake --manifest "$RUNNER_TEMP/perf-manifest.json" \
            --output "$RUNNER_TEMP/collected-profile"

      - name: Render advisory heartbeat profile (trusted)
        if: ${{ steps.collect_heartbeats.outcome == 'success' }}
        continue-on-error: true
        env:
          PREP: ${{ runner.temp }}/collected-profile
          OUTPUT: ${{ github.workspace }}/profile.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 gate/scripts/profile/render.py

      - name: Post or update performance and heartbeat comments
        if: ${{ always() && steps.pr.outputs.num != 'merge-group' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.pr.outputs.num }}
        run: |
          set -euo pipefail
          update_comment() {
            local marker="$1" file="$2" existing
            [ -r "$file" ] || return 0
            existing=$(gh api "repos/${{ github.repository }}/issues/$NUM/comments" --paginate \
              --jq "[.[] | select(.body | startswith(\"$marker\"))] | first | .id // empty")
            if [ -n "$existing" ]; then
              jq -n --rawfile body "$file" '{body: $body}' \
                | gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" --input -
            else
              gh pr comment "$NUM" --repo '${{ github.repository }}' --body-file "$file"
            fi
          }
          update_comment '<!-- lean-performance-comment -->' performance.md
          update_comment '<!-- proof-profile-comment -->' profile.md

      - name: Post terminal required perf status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pr.outputs.status_sha }}
          FILE_COUNT: ${{ steps.manifest.outputs.count }}
          BASE_OUTCOME: ${{ steps.base_perf.outcome }}
          HEAD_OUTCOME: ${{ steps.head_perf.outcome }}
          REPORT_OUTCOME: ${{ steps.report.outcome }}
          METRIC: ${{ steps.metric.outputs.mode }}
        run: |
          set -uo pipefail
          if [ "$FILE_COUNT" = 0 ] && [ "$REPORT_OUTCOME" = success ]; then
            state=success
            description='no added or modified TauCeti Lean files'
          elif [ "$BASE_OUTCOME" = success ] && [ "$HEAD_OUTCOME" = success ] && [ "$REPORT_OUTCOME" = success ]; then
            state=success
            description="wall-time and $METRIC budgets passed"
          else
            state=failure
            description='Lean performance gate failed (see run and report)'
          fi
          posted=0
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/statuses/$SHA" \
              -f state="$state" -f context=perf -f description="$description" \
              -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'; then
              posted=1
              break
            fi
            [ "$attempt" = 3 ] || sleep $((attempt * 5))
          done
          [ "$posted" = 1 ] || { echo '::error::could not post terminal perf status'; exit 1; }
          [ "$state" = success ]
