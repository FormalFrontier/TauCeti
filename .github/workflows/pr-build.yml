name: pr-build

# Builds the exact immutable PR head in a TRUSTED, base-branch-defined workflow. A PR cannot
# change what runs here (pull_request_target uses the base definition). Before Lake sees the
# candidate, the workflow proves that its lakefile is an ordinary file byte-identical to the
# PR's merge base and that its pins are either inherited unchanged or a validated forward bump.
# Workflow-pinned audit tooling is mounted separately; candidate scripts are never invoked by
# the required build. Candidate Lean code runs only under landrun (offline; writes confined to
# the checkout's .lake; no secrets or token in reach). Scope is a separate policy status, so an
# old PR keeps its own historical pins and sources rather than being synthetically merged or
# overlaid onto today's main. The `build` status on the exact head SHA is the required check.
#
# The job below is deliberately NOT named `build`: GitHub Actions auto-creates a check-run named
# after the job, and a check-run named `build` would collide with the required `build` STATUS this
# job posts. Branch protection matches the required context `build` against BOTH commit statuses and
# check-runs by name, so two `build` results (a green status + a red job check-run) wedge the PR as
# BLOCKED even though the authoritative build passed — e.g. when the job's final report step exits
# nonzero on a transient "could not list files" (INFRA) hiccup while a healthy re-run posts the green
# status. Keeping the job name distinct leaves exactly one `build` (the status) as the merge gate.
#
# Live on pull_request_target (fires for all PRs, incl. forks, from the trusted base definition).
# workflow_dispatch is also kept for ad-hoc re-testing of a given PR number.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # The merge queue tests a batch (one or more PRs combined onto current main) before it lands. We
  # build the COMBINED merge-group commit exactly as GitHub synthesized it and post the `build`
  # status on it so the queue's required check is satisfied. A combined diff that reaches outside
  # TauCeti/ gets a red scope status; the trusted build harness remains independent of that diff.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pr: { description: "PR number to build", required: true, type: string }

permissions:
  contents: read
  statuses: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || inputs.pr || github.event.merge_group.head_sha }}
  cancel-in-progress: true

env:
  # Read endpoint for `lake exe cache get`, wired from a repository variable. The cache tool
  # treats unset and empty alike, so clearing the variable returns reads to the tool's
  # default endpoints on the next run.
  MATHLIB_CACHE_GET_URL: ${{ vars.MATHLIB_CACHE_GET_URL }}

jobs:
  # Name kept distinct from `build` on purpose — see the header note. The required merge check is the
  # `build` commit STATUS posted in the final step, not this job's auto-created check-run.
  sandboxed-build:
    runs-on: ubuntu-24.04
    outputs:
      status-sha: ${{ steps.pr.outputs.status_sha }}
      build-state: ${{ steps.report.outputs.build-state }}
      build-description: ${{ steps.report.outputs.build-description }}
      publication-required: ${{ steps.report.outputs.publication-required }}
      reported-toolchain: ${{ steps.cache_stage.outputs.toolchain }}
    env:
      LANDRUN_SHA256: 645178e3239cd33760560834e50efea0864183a2a8a82faf199760dffee6dd71
      LANDRUN_VER: v0.1.14
      # Lake artifact-cache knobs, off by default. The "Configure the Lake artifact cache"
      # step flips these on (and sets LAKE_CACHE_DIR) ONLY when the public cache endpoints
      # are installed as repo variables; until then they stay empty and the build runs
      # exactly as before (a full recompile of TauCeti/). Declared here so the landrun
      # build's `--env` list always has a defined value to pass.
      LAKE_ARTIFACT_CACHE: ""
      LAKE_RESTORE_ARTIFACTS: ""
      LAKE_CACHE_DIR: ""
      # Enabled only for a merge-group commit when the upload service is configured. The
      # sandbox then stages the fully audited root-package outputs for the isolated publisher.
      STAGE_LAKE_CACHE: ""
    steps:
      # --- Trusted setup: no PR code runs until the landrun build phase ---
      - name: Resolve PR head
        id: pr
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # Build the COMBINED merge-group commit (current base + ALL batched PRs, squash-merged by
            # GitHub onto the gh-readonly-queue ref), not any single PR — so a batch is tested as a
            # whole. The combined commit lives in THIS repo, is checked out exactly below, and the
            # required `build` status lands on that merge-group commit.
            REPO='${{ github.repository }}'
            SHA='${{ github.event.merge_group.head_sha }}'
            # Use the IMMUTABLE base SHA the queue synthesized this group on — NOT the mutable `main`
            # tip, which may have advanced since the group was formed. Building the batch's TauCeti/
            # as a different commit would test (and green-light) the wrong batch. This base_sha
            # drives the combined-diff scope compare and forward-bump policy input below.
            BASE_REF='${{ github.event.merge_group.base_sha }}'
            STATUS_SHA='${{ github.event.merge_group.head_sha }}'
            NUM="merge-group"   # not a single PR; scope/diff use the combined base..head diff below
            AUTHOR=""           # author was checked before enqueue; strict config validation repeats below
          elif [ "${{ github.event_name }}" = "pull_request_target" ]; then
            NUM='${{ github.event.pull_request.number }}'
            SHA='${{ github.event.pull_request.head.sha }}'
            REPO='${{ github.event.pull_request.head.repo.full_name }}'
            BASE_REF='${{ github.event.pull_request.base.ref }}'
            STATUS_SHA="$SHA"
            AUTHOR='${{ github.event.pull_request.user.login }}'
          else
            NUM='${{ inputs.pr }}'
            SHA=$(gh api "repos/${{ github.repository }}/pulls/$NUM"  --jq .head.sha)
            REPO=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .head.repo.full_name)
            BASE_REF=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .base.ref)
            STATUS_SHA="$SHA"
            AUTHOR=$(gh api "repos/${{ github.repository }}/pulls/$NUM" --jq .user.login)
          fi
          # Resolve the target branch to a commit ONCE. Everything below -- policy validation,
          # the merge-base attestation, and the scope compare -- then refers to the same base,
          # instead of each step separately racing a branch that moves every few minutes. For
          # merge_group BASE_REF is already the immutable base_sha the queue synthesized on.
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            BASE_SHA=$(gh api "repos/${{ github.repository }}/commits/$BASE_REF" --jq .sha 2>/dev/null) || BASE_SHA=""
            if [ -z "$BASE_SHA" ]; then
              echo "INFRA=1" >> "$GITHUB_ENV"
              echo "::warning::could not resolve $BASE_REF to a commit — re-run pr-build"
            fi
          else
            BASE_SHA="$BASE_REF"
          fi

          # Merge-base with the target branch, for the Lake-pin bump validation below:
          # check-bump.sh uses it to scope the PR's own pin delta. owner:sha for forks;
          # `|| true` so a failed substitution does not trip set -e before the fallback.
          #
          # Against BASE_SHA, not the branch name: check-bump.sh reads mergebase/ to decide
          # whether the pins were touched at all, so if the branch moved between here and the
          # checkouts, base/, pr/ and mergebase/ would be describing three different bases and
          # that decision would be made against a snapshot nothing else in the job shares.
          OWNER="${REPO%%/*}"
          MB=$(gh api "repos/${{ github.repository }}/compare/${BASE_SHA}...${OWNER}:${SHA}" \
                 --jq '.merge_base_commit.sha' 2>/dev/null || true)
          if [ -n "$MB" ]; then
            echo "MERGEBASE_EXACT=1" >> "$GITHUB_ENV"
          else
            MB="$BASE_SHA"
            echo "::warning::merge-base unresolved; falling back to the base commit $BASE_SHA"
          fi
          {
            echo "num=$NUM"
            echo "base_sha=$BASE_SHA"
            echo "sha=$SHA"
            echo "repo=$REPO"
            echo "base_ref=$BASE_REF"
            echo "mergebase=$MB"
            echo "status_sha=$STATUS_SHA"
            echo "author=$AUTHOR"
          } >> "$GITHUB_OUTPUT"
          echo "Building PR #$NUM @ $SHA from $REPO (author=${AUTHOR:-merge-group}, status -> $STATUS_SHA, bump delta vs merge-base $MB)"

      - name: Scope guard — allow TauCeti sources and validated pins
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [ "${{ github.event_name }}" = "merge_group" ]; then
            # The whole batch's combined change set vs the trusted base (every batched PR).
            files=$(gh api "repos/${{ github.repository }}/compare/${{ steps.pr.outputs.base_ref }}...${{ steps.pr.outputs.sha }}" --jq '.files[].filename')
            # The compare endpoint caps `.files` at 300. If we hit that, the list may be truncated and
            # could hide an out-of-scope path — fail closed (route to human); the queue then bisects the
            # batch into smaller groups that fit under the cap. (Realistic batches are far under 300.)
            if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
              echo "INFRA=1" >> "$GITHUB_ENV"
              echo "::warning::merge-group combined diff hit the compare 300-file cap — failing closed so the queue bisects"
            fi
          else
            files=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}/files" --jq '.[].filename')
          fi
          echo "changed files:"; echo "$files"
          # The root TauCeti.lean is allowed alongside TauCeti/: it is the (intentionally
          # empty) library root, normally untouched, but a PR may edit it. Everything else
          # outside TauCeti/ (scripts/, .github/, arbitrary Lake config) routes to a human.
          # Candidate scripts are never used by the trusted harness, and a changed lakefile is
          # rejected before Lake executes, independently of this merge-policy status.
          # lake-manifest.json and lean-toolchain are also permitted, but ONLY as a
          # machine-validated forward bump: the "Validate the Lake-pin bump" step below
          # runs the workflow-pinned scripts/check-bump.sh and routes to a human if it is
          # anything other than a forward move (mathlib forward on its nominated branch,
          # transitive pins derived from mathlib, toolchain monotonic).
          # docbuild/docs/references.bib is permitted too. It is the bibliography doc-gen4
          # resolves docstring citations against, so a docstring that cites a work no one has
          # entered renders as a bare bracketed key. Filling that in is the same kind of work as
          # writing the docstring, and holding it for a human merge stalled exactly that. It is
          # BibTeX consumed only by the pages build, never by Lake or the harness, so nothing
          # here executes it. The rest of docbuild/ stays human-owned: lakefile.toml, the pin,
          # and the two generator scripts all feed the docs build itself.
          # Two independent questions: does this reach outside TauCeti/, and does it change the
          # Lake pins. They used to share an `elif`, so a PR doing both was only ever answered as
          # out-of-scope: BUMP stayed unset, check-bump.sh never ran, and the report step could
          # not tell that apart from a PR with no pin change at all — so it posted the required
          # bump-guard status green, asserting a validation that had not happened, to the human
          # being asked to merge exactly that kind of PR by hand.
          if [ -z "$files" ]; then
            echo "INFRA=1" >> "$GITHUB_ENV"; echo "::warning::no files / unable to list — cannot determine scope, routing to human"
          else
            if echo "$files" | grep -vqE '^TauCeti/|^TauCeti\.lean$|^lake-manifest\.json$|^lean-toolchain$|^docbuild/docs/references\.bib$'; then
              if echo "$files" | grep -qE '^lakefile\.(toml|lean)$'; then
                echo "HUMAN_LAKEFILE=1" >> "$GITHUB_ENV"
              fi
              echo "OUT_OF_SCOPE=1" >> "$GITHUB_ENV"
              echo "::warning::PR changes paths outside TauCeti/ + Lake pins — its exact head is still sandbox-built when its Lake config is attested, but merging needs human review"
            fi
          fi
          # Whether THIS pull request changes the Lake pins, asked of the immutable commit this
          # run will post its statuses to, and of that commit's merge base.
          #
          # Not from the file list above, for two reasons. That list describes the pull request's
          # CURRENT head, while the statuses describe the head named by the event: a branch that
          # advances between the two makes the answer describe a different commit, and a branch
          # that advances and then comes back defeats the final head re-check as well. And the
          # list is capped — 300 entries for a merge group, 3000 for a pull request — so a pin
          # file sitting past the end of it would read as no pin change at all.
          #
          # Comparing blob SHAs at two immutable commits has neither problem, and asking the
          # merge base rather than the branch tip keeps the question "did this pull request
          # change the pins" rather than "have the pins moved since this branch was cut".
          # A merge group's head descends from its base_sha, so the fallback below is exact
          # there. For an ordinary pull request it is a guess, and the pin question cannot be
          # answered against a guess.
          if [ "${{ github.event_name }}" != "merge_group" ] && [ "${{ env.MERGEBASE_EXACT }}" != "1" ]; then
            pins_known=0
            echo "::warning::merge base unresolved — pin state unknown"
          else
            pins_known=1
          fi
          pins_changed=0
          toolchain_changed=0
          # Whole tree entries, not just blob IDs. Git keeps the mode beside the object, and a
          # symlink is a blob holding its target path — so `lean-toolchain` can be re-pointed at
          # mode 120000 while REUSING the existing blob. Its ID would be unchanged, this would
          # conclude no pin change, the validator would not run, and main would end up with a
          # dangling symlink where its toolchain should be. Requiring an ordinary file at the head
          # closes that separately from the comparison.
          tree_entry() {
            gh api "repos/${{ github.repository }}/git/trees/$1" \
              --jq ".tree[] | select(.path==\"$2\") | [.mode, .type, .sha] | join(\" \")" 2>/dev/null
          }
          for f in lake-manifest.json lean-toolchain; do
            mb_entry=$(tree_entry "${{ steps.pr.outputs.mergebase }}" "$f") || mb_entry=""
            head_entry=$(tree_entry "${{ steps.pr.outputs.sha }}" "$f") || head_entry=""
            if [ -z "$mb_entry" ] || [ -z "$head_entry" ]; then
              pins_known=0
              echo "::warning::could not read the tree entry for $f — pin state unknown"
              continue
            fi
            case "$head_entry" in
              "100644 blob "*) ;;
              *) pins_known=0
                 echo "::error::$f is not an ordinary file at the head ($head_entry)"
                 continue ;;
            esac
            if [ "$mb_entry" != "$head_entry" ]; then
              pins_changed=1
              # Which pin moved matters to the cache step below, not just whether one did. The
              # Lake cache keys each revision map by toolchain, so when lean-toolchain moves no
              # ancestor can hold a map under the new one and the lookup is known-futile before
              # it starts. A manifest-only bump keeps the toolchain and still hits.
              if [ "$f" = "lean-toolchain" ]; then toolchain_changed=1; fi
            fi
          done
          if [ "$pins_known" = "1" ]; then echo "PINS_KNOWN=1" >> "$GITHUB_ENV"; fi
          if [ "$pins_changed" = "1" ]; then
            echo "BUMP=1" >> "$GITHUB_ENV"
            echo "::notice::PR changes Lake pins — validating as a forward bump before building"
          fi
          # Set only when both tree entries were read and differ, so an unresolved merge base
          # leaves it unset and the lookup runs as before: unknown means look, never means skip.
          if [ "$toolchain_changed" = "1" ]; then
            echo "TOOLCHAIN_CHANGED=1" >> "$GITHUB_ENV"
            echo "::notice::PR moves lean-toolchain — the Lake cache lookup will ask about this revision only, since the maps are keyed by toolchain and every ancestor was published under the old one"
          fi

          # The report step runs under `if: always()`. Mark successful completion explicitly so an
          # API or shell failure above cannot be misreported as a green scope decision.
          echo "SCOPE_OK=1" >> "$GITHUB_ENV"

      - name: Diff size guard — additions, deletions, and changed files each ≤ 2000 (trusted GitHub PR totals)
        # Per-PR cap, enforced when each PR is built on pull_request_target (its entry condition to the
        # queue). A merge_group batch is the sum of already-capped PRs, so we don't re-cap the combined
        # size here. (The scope guard's 300-file compare cap still bounds the batch's file count.)
        if: ${{ github.event_name != 'merge_group' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # The file-count cap also backstops the scope guard above: the PR files API lists at
          # most 3000 files, so a huge PR could hide an out-of-scope path from that listing.
          # Failing here at 2000 files closes that gap before the API limit is reachable.
          read -r adds dels files < <(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}" \
            --jq '"\(.additions) \(.deletions) \(.changed_files)"')
          echo "diff size: +$adds / -$dels across $files files (cap: 2000 each)"
          # Fail closed on non-numeric data: [ -gt ] errors on garbage but an `if` would
          # swallow that as false, silently passing the guard.
          if ! [[ "$adds" =~ ^[0-9]+$ && "$dels" =~ ^[0-9]+$ && "$files" =~ ^[0-9]+$ ]]; then
            echo "DIFF_UNKNOWN=1" >> "$GITHUB_ENV"
            echo "::error::could not read the PR's diff totals from the GitHub API (+$adds / -$dels / $files files); failing closed"
            exit 1
          fi
          if [ "$adds" -gt 2000 ] || [ "$dels" -gt 2000 ] || [ "$files" -gt 2000 ]; then
            echo "TOO_LARGE=1" >> "$GITHUB_ENV"
            echo "::error::This PR is too large to review: +$adds / -$dels lines across $files files (cap: 2000 added lines, 2000 removed lines, 2000 files). We cap diff size to keep review manageable — reviewers, AI and human alike, do far better work on small, focused PRs. Please split this into smaller PRs, one topic each. We are open to raising the cap once there is evidence that review is working well at the current size."
            exit 1
          fi

      - name: New-file length guard — newly added .lean files must be ≤ 1000 lines
        # A brand-new file may be at most 1000 lines; an existing file may grow up to the
        # in-build linter ceiling of 1500 (set in lakefile.toml). The split keeps new material
        # small and reviewable while not blocking incremental growth of established files.
        # PR-only, like the diff-size guard: new files enter the library through a PR, and a
        # merge_group batch is the sum of already-guarded PRs. For an *added* file the GitHub
        # diff lists every line as an addition, so `.additions` is its line count.
        if: ${{ github.event_name != 'merge_group' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          long=$(gh api --paginate "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}/files" \
            --jq '.[] | select(.status == "added" and (.filename | endswith(".lean")) and .additions > 1000)
                      | "\(.filename) (\(.additions) lines)"')
          if [ -n "$long" ]; then
            echo "NEWFILE_TOO_LONG=1" >> "$GITHUB_ENV"
            echo "::error::New .lean files must be at most 1000 lines; these exceed it. Split them, or grow an existing file (allowed up to 1500):"
            echo "$long"
          fi

      # The current target tip is trusted policy input for forward-bump validation only. It is
      # never used as the source or configuration tree of an ordinary PR build.
      - name: Checkout current base policy input (trusted)
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          ref: "${{ steps.pr.outputs.base_sha }}"
          path: base
          persist-credentials: false
          fetch-depth: 1

      # This is the commit that supplied the pull_request_target / merge_group workflow. All
      # executable audit, watchdog, cache, and bump-validation tooling comes from here.
      - name: Checkout workflow-pinned trusted build tooling
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: gate
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout the PR merge base (trusted historical configuration)
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.mergebase }}
          path: mergebase
          persist-credentials: false
          fetch-depth: 1

      # Full history is intentional. lake cache get walks ancestors until it reaches a published
      # main commit, then Lake's input hashes invalidate only changed modules and their downstream
      # dependents. The cache step below limits how many ancestors it reads. The checkout is the
      # immutable event head itself: no refs/pull/N/merge, no local merge, and no source/config
      # overlay.
      - name: Checkout the exact candidate head (untrusted contents, no credentials)
        if: ${{ env.INFRA != '1' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pr.outputs.repo }}
          ref: ${{ steps.pr.outputs.sha }}
          path: pr
          persist-credentials: false
          fetch-depth: 0
          allow-unsafe-pr-checkout: true

      - name: Attest exact-head Lake configuration before executing Lake
        if: ${{ env.INFRA != '1' }}
        run: |
          set -euo pipefail
          if bash gate/scripts/attest-pr-config.sh \
               mergebase pr '${{ steps.pr.outputs.sha }}' '${{ github.event_name }}' \
               "${MERGEBASE_EXACT:-0}" "${BUMP:-0}"; then
            echo "CONFIG_ATTESTED=1" >> "$GITHUB_ENV"
            echo "Exact candidate Lake configuration attested against merge base ${{ steps.pr.outputs.mergebase }}."
          else
            echo "CONFIG_BAD=1" >> "$GITHUB_ENV"
            echo "INFRA=1" >> "$GITHUB_ENV"
            echo "::warning::candidate Lake configuration failed trusted attestation; refusing to execute it"
          fi

      # For a pin-changing candidate, the workflow-pinned validator proves a forward Mathlib and
      # toolchain move before dependency setup. Unchanged historical pins inherit trust from the
      # attested merge base and need no comparison with today's main.
      - name: Validate the Lake-pin bump before building
        if: ${{ env.INFRA != '1' && env.BUMP == '1' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if bash gate/scripts/check-bump.sh base mergebase pr; then
            echo "BUMP_VALIDATED=1" >> "$GITHUB_ENV"
            echo "Lake-pin bump validated — building the exact candidate with its new pins."
          else
            echo "BUMP_BAD=1" >> "$GITHUB_ENV"
            echo "INFRA=1" >> "$GITHUB_ENV"
            echo "::warning::Lake-pin change is not a validated forward bump — refusing to execute it"
          fi

      - name: Candidate source shape guard (reject symlinks)
        if: ${{ env.INFRA != '1' }}
        run: |
          test -d pr/TauCeti && test ! -L pr/TauCeti
          if find pr/TauCeti -type l -print | grep -q .; then
            echo "::error::symlinks are not allowed under TauCeti/"
            exit 1
          fi
          test -f pr/TauCeti.lean && test ! -L pr/TauCeti.lean

      - name: Prepare inherited Mathlib shim obligations
        if: ${{ env.INFRA != '1' }}
        run: |
          # Compare with the inherited registry (not today's base tip), so unrelated source
          # PRs from inheriting registry edits that landed after they branched.
          base_shims="$RUNNER_TEMP/base-mathlib-shims.json"
          if [ -f mergebase/TauCeti/mathlib-shims.json ]; then
            cp mergebase/TauCeti/mathlib-shims.json "$base_shims"
            echo "BASE_SHIM_REGISTRY=$base_shims" >> "$GITHUB_ENV"
            echo "BASE_SHIM_ROOT=$(realpath mergebase)" >> "$GITHUB_ENV"
            echo "SHIM_CHECK=1" >> "$GITHUB_ENV"
          elif [ -f pr/TauCeti/mathlib-shims.json ]; then
            # A PR that introduces the registry has no inherited obligations, but its entries are
            # all new and must still be checked. An older PR containing neither copy predates the
            # mechanism and is left alone until it rebases onto a registry-bearing main.
            printf '[]\n' > "$base_shims"
            echo "BASE_SHIM_REGISTRY=$base_shims" >> "$GITHUB_ENV"
            echo "BASE_SHIM_ROOT=$(realpath mergebase)" >> "$GITHUB_ENV"
            echo "SHIM_CHECK=1" >> "$GITHUB_ENV"
          else
            echo "SHIM_CHECK=0" >> "$GITHUB_ENV"
          fi

      - name: Import-boundary guard (TauCeti/ and TauCeti.lean ⊬ roadmap/review)
        if: ${{ env.INFRA != '1' }}
        run: |
          if grep -rIn -E '^[[:space:]]*import[[:space:]]+(TauCetiRoadmap|TauCetiReview)\b' pr/TauCeti/ pr/TauCeti.lean; then
            echo "::error::TauCeti/ must not import TauCetiRoadmap or TauCetiReview"
            exit 1
          fi

      - name: No-set_option guard (TauCeti/ and TauCeti.lean use no set_option)
        if: ${{ env.INFRA != '1' }}
        run: |
          if grep -rIn '^set_option ' pr/TauCeti/ pr/TauCeti.lean; then
            echo "::error::TauCeti/ may not use set_option (it can weaken maxHeartbeats, linters, maxRecDepth, ...); remove it"
            exit 1
          fi

      # The trusted checker requires each source-only PR that declares a new temporary Mathlib shim
      # to record a concrete expiry target in TauCeti's AI-owned registry. Keeping the registry under
      # TauCeti/ lets a worker add or remove entries in the same autonomous source PR as the shim.
      - name: Temporary Mathlib shims have machine-checkable expiry targets
        id: shim_coverage
        if: ${{ env.INFRA != '1' && env.OUT_OF_SCOPE != '1' && env.SHIM_CHECK == '1' }}
        continue-on-error: true
        run: |
          set +e
          args=(--coverage-only)
          [ -z "${BASE_SHIM_REGISTRY:-}" ] || args+=(
            --base-manifest "$BASE_SHIM_REGISTRY" --base-root "$BASE_SHIM_ROOT"
          )
          python3 gate/scripts/check-expired-mathlib-shims.py \
            --repo-root pr --manifest pr/TauCeti/mathlib-shims.json "${args[@]}"
          rc=$?
          echo "SHIM_COVERAGE_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      # Take elan from a pinned leanprover/elan release verified by SHA-256, not from whatever
      # the installer URL serves at the moment of the request. This elan chooses the `lake` the
      # sandboxed build runs, and it is installed here, in the trusted phase, before landrun
      # confines anything, so a substituted one would sit outside the sandbox by construction.
      # Same idiom as the landrun pin below; scripts/test_elan_pin.py keeps the copies honest.
      - name: Install elan (trusted, pinned + checksum)
        if: ${{ env.INFRA != '1' }}
        env:
          ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
          ELAN_VER: v4.2.3
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VER}/elan-x86_64-unknown-linux-gnu.tar.gz" -o elan.tar.gz
          echo "${ELAN_SHA256}  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          rm -f elan.tar.gz elan-init
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install landrun (pinned + checksum) and self-test (fail closed)
        if: ${{ env.INFRA != '1' }}
        run: |
          curl -sSL -H "Accept: application/octet-stream" \
            "https://github.com/Zouuup/landrun/releases/download/${LANDRUN_VER}/landrun-linux-amd64" -o landrun
          echo "${LANDRUN_SHA256}  landrun" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"; install -m 0755 landrun "$HOME/.local/bin/landrun"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          landrun --version || true
          # Prove the sandbox enforces before trusting it with PR code: run works, out-of-tree
          # write denied, /dev/shm write denied, network denied without the flag.
          set +e
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo ok' >/dev/null 2>&1; ok=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /etc/landrun-probe' >/dev/null 2>&1; wr=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'echo x > /dev/shm/landrun-probe' >/dev/null 2>&1; shm=$?
          landrun --rox /usr --rox /etc --rw /dev/null -- bash -c 'curl -sS --max-time 8 https://example.com >/dev/null' >/dev/null 2>&1; net=$?
          set -e
          echo "self-test: run=$ok write=$wr shm=$shm net=$net (nonzero = denied for w/shm/net)"
          if [ $ok -ne 0 ] || [ $wr -eq 0 ] || [ $shm -eq 0 ] || [ $net -eq 0 ]; then
            echo "::error::landrun not enforcing (run=$ok write=$wr shm=$shm net=$net); refusing to run PR code"; exit 1
          fi

      # Restore only Mathlib's compressed, content-addressed `.ltar` download store from a
      # trusted main publisher. This workflow never writes that GitHub Actions cache. The keys
      # hash the exact candidate pins, so an exact historical or new-pin snapshot is preferred. A
      # Mathlib-only bump can fall back to the newest same-toolchain main snapshot; a toolchain
      # bump misses both keys and refetches from Mathlib's server. `lake exe cache get` below
      # remains authoritative and downloads every applicable hash that is still absent. The
      # workflow-pinned local action credits the corresponding Mathlib design and owns the key
      # namespace shared with ci.yml. This is separate from the much larger `./.lake` cache.
      - name: Restore Mathlib's compressed download cache from main
        if: ${{ env.INFRA != '1' }}
        uses: ./gate/.github/actions/restore-mathlib-ltars
        with:
          # The action's default cache directory is outside pr/, which is later mounted into
          # landrun. Although MATHLIB_CACHE_DIR is job-wide, landrun's explicit `--env` allowlist
          # excludes it and the cache directory is not mounted, so the sandbox never receives it.
          project-dir: pr

      # `lake exe cache get` runs the `cache` exe built from the pinned Mathlib, unsandboxed,
      # with network (to download oleans) but deliberately NO token in env. For a normal PR that
      # pin is inherited from its trusted merge base. For a validated bump it is the new pin — which
      # bump-guard proved is a *forward commit on Mathlib's own master* (same repo, never a fork),
      # so the code run here is still trusted Mathlib master under the project's "track master"
      # policy; only the PR's TauCeti/ code stays untrusted and runs solely under landrun below.
      - name: Fetch Mathlib with the (bump-validated) config (network, no token; no PR code)
        if: ${{ env.INFRA != '1' }}
        # `set -o pipefail` is not optional here. A `run:` step with no explicit `shell:`
        # gets the runner default `bash -e {0}`, which does NOT set pipefail, so piping
        # into `tee` would report the pipeline's status as tee's and swallow a failing
        # `cache get` on every PR, not just a bump. Naming the shell also sets pipefail;
        # both are here so neither the tee nor the guard below depends on runner defaults.
        shell: bash
        run: |
          set -o pipefail
          if ! ( cd pr && lake exe cache get ) 2>&1 | tee "$GITHUB_WORKSPACE/cache-get.log"; then
            echo "::warning::lake exe cache get failed; forcing a full refetch"
            ( cd pr && lake exe cache get! ) 2>&1 | tee "$GITHUB_WORKSPACE/cache-get.log"
          fi
          mkdir -p pr/.lake/tmp

      # Backstop to bump-guard's step 2b, measuring the thing itself rather than a proxy.
      # `lake exe cache get` exits 0 on a PARTIAL hit: it prints one warning and the build
      # then quietly recompiles every module whose oleans never arrived. That is invisible
      # in a green build and costs about an hour on every downstream build until the pin
      # moves again, so catch it here (roughly 90 seconds in) rather than after the build.
      #
      # Only a bump is judged. A normal PR builds against its inherited pin, which it did not
      # choose and cannot fix; failing those would take every PR in the repo down for as
      # long as a bad pin sat on main, which is precisely backwards.
      - name: Require a complete Mathlib cache for a bump
        if: ${{ env.INFRA != '1' && env.BUMP == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/cache-get.log"
          # Fail closed. An absent or unreadable log is not evidence of a complete cache,
          # and `grep` on a missing file exits 2, which as an `if` condition would read the
          # same as "phrase not found" and wave the bump through.
          if [ ! -r "$log" ]; then
            echo "::error::$log is missing or unreadable, so cache completeness cannot be established for this bump"
            exit 1
          fi
          if grep -qF 'some files were not found in the cache' "$log"; then
            echo "::error::the bump target's Mathlib cache is incomplete, so this pin would make every downstream build recompile the missing modules; bump to a commit whose master-push build published its cache"
            exit 1
          fi
          echo "Mathlib cache is complete at the bump target."

      # Text-only trusted lint: inspect the exact candidate sources after Mathlib's source tree is
      # available. The workflow-pinned Python does not elaborate or execute candidate code.
      - name: Dot-notation namespace lint (Mathlib type namespaces stay at root)
        if: ${{ env.INFRA != '1' }}
        run: |
          python3 gate/scripts/lint-dot-notation.py \
            --baseline gate/scripts/lint-dot-notation-baseline.txt \
            --mathlib-root pr/.lake/packages/mathlib/Mathlib \
            --source-root pr/TauCeti

      # Enable Lake's built-in artifact cache for the build below ONLY when the public read
      # endpoints are configured (repo variables). Until then this is a no-op: LAKE_*
      # stay empty and the landrun build recompiles TauCeti/ from scratch exactly as before.
      # The cache dir lives under pr/.lake/ so the offline landrun build (which mounts
      # pr/.lake rw) can read what the network `lake cache get` step populates. We never
      # pass the cache *endpoints* into landrun, so the sandboxed build stays offline and
      # can only consult the locally-populated cache.
      - name: Configure the Lake artifact cache (no-op unless the public endpoints are set)
        if: ${{ env.INFRA != '1' }}
        env:
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
        run: |
          if [ -n "$PUBLIC_ARTIFACT_ENDPOINT" ] && [ -n "$PUBLIC_REVISION_ENDPOINT" ]; then
            {
              echo "LAKE_CACHE_DIR=$PWD/pr/.lake/cache"
              echo "LAKE_ARTIFACT_CACHE=true"
              echo "LAKE_RESTORE_ARTIFACTS=true"
              echo "TAUCETI_CACHE_ENABLED=1"
            } >> "$GITHUB_ENV"
            echo "::notice::Lake artifact cache enabled — will fetch TauCeti's oleans and build incrementally"
          else
            echo "::notice::Lake artifact cache not configured — building TauCeti/ from scratch (set the LAKE_CACHE_*_PUBLIC repo variables to enable)"
          fi
          # A merge-group head is the exact commit GitHub will land. Stage its outputs after every
          # sandboxed audit so the required build can wait for publication.
          if [ "${{ github.event_name }}" = "merge_group" ] \
             && [ -n "$S3_ARTIFACT_ENDPOINT" ] && [ -n "$S3_REVISION_ENDPOINT" ]; then
            echo "STAGE_LAKE_CACHE=1" >> "$GITHUB_ENV"
            echo "::notice::merge-group outputs will be staged for pre-landing publication"
          fi

      # Restore TauCeti's own root-package oleans from the public Lake cache. The fetch logic
      # (retry-from-empty, then fall back to no cache at all) lives in the workflow-pinned
      # trusted script so ci.yml's post-merge build can restore the very same way; see its
      # header for why a partial fetch must be discarded rather than kept.
      - name: Fetch TauCeti's own oleans from the Lake cache (network, no token; no PR code)
        if: ${{ env.INFRA != '1' && env.TAUCETI_CACHE_ENABLED == '1' }}
        env:
          # Passed under non-LAKE_ names so Lake never sees the deprecated endpoint
          # environment variables; the script hands it the endpoints through a `--service` config.
          PUBLIC_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT_PUBLIC }}
          PUBLIC_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT_PUBLIC }}
          # How far back it is worth asking, which depends on whether an ancestor could hold
          # a usable map at all. The maps are keyed by toolchain, so once lean-toolchain moves
          # every ancestor was published under the old one and walking them cannot hit: ask
          # about HEAD alone and stop. HEAD itself is still worth one request, because a
          # merge-group re-run of a bump that already built once finds its own published
          # outputs there — the case an outright skip would recompile from scratch.
          #
          # Otherwise a walk can pay, so bound it only as a backstop against something we have
          # not characterised. Overrunning the bound is indistinguishable from a genuine miss,
          # and a miss costs a full recompile (~2h) against the ~4 minutes a 1000-revision walk
          # costs at the rate observed in the run that motivated #5396 — so it is sized to be
          # reached only by the genuinely unexpected. At main's current rate 1000 is about three
          # weeks of history, against roughly 39 hours for the 100 it replaces.
          #
          # The scope guard above answers the toolchain question from the immutable tree entries
          # at the merge base and the head, and leaves it unset whenever it could not read them,
          # so unknown falls through to the walk rather than to the single lookup.
          LAKE_CACHE_MAX_REVS: ${{ env.TOOLCHAIN_CHANGED == '1' && '1' || '1000' }}
        run: bash gate/scripts/lake-cache-get.sh pr

      - name: Prepare trusted read-only Lean watchdog toolchain
        if: ${{ env.INFRA != '1' }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          real_lean=$(cd pr && elan which lean)
          watchdog="$RUNNER_TEMP/lean-watchdog-toolchain"
          bash gate/scripts/perf/prepare-watchdog-toolchain.sh "$watchdog" "$real_lean"
          echo "WATCHDOG_TOOLCHAIN=$watchdog" >> "$GITHUB_ENV"

      - name: Build exact candidate under landrun with workflow-pinned audits, offline
        id: build
        if: ${{ env.INFRA != '1' }}
        env:
          # The sandboxed build is always offline: never let Lake reach out to a remote
          # cache from inside landrun. When the artifact cache is enabled above, it restores
          # TauCeti's oleans purely from the locally-populated $LAKE_CACHE_DIR; when it is
          # not, this is a normal full build. Either way, no network from in here.
          LAKE_NO_CACHE: "true"
        run: |
          export PATH="$HOME/.local/bin:$HOME/.elan/bin:$PATH"
          # The sandboxed build/audit/lint body comes from the separately mounted, workflow-pinned
          # gate checkout; candidate scripts are never invoked. Keeping the landrun bash payload
          # a fixed, comment-free one-liner
          # is deliberate: a comment's apostrophe once closed this single-quoted string
          # early and reddened every PR build (#694). All prose now lives in the script.
          export TAUCETI_PROJECT_ROOT="$PWD/pr"
          export TAUCETI_TRUSTED_SCRIPTS="$PWD/gate/scripts"
          landrun --rox /usr --rox /etc \
            --rw /dev/null --rox /dev/zero --rox /dev/urandom --rox /dev/random \
            --rox "$HOME/.elan" --rox "$WATCHDOG_TOOLCHAIN" \
            --rox "$PWD/pr" --rw "$PWD/pr/.lake" --rox "$PWD/gate" \
            --env PATH --env HOME --env CI \
            --env LAKE_NO_CACHE --env LAKE_ARTIFACT_CACHE --env LAKE_RESTORE_ARTIFACTS --env LAKE_CACHE_DIR \
            --env WATCHDOG_TOOLCHAIN --env STAGE_LAKE_CACHE \
            --env TAUCETI_PROJECT_ROOT --env TAUCETI_TRUSTED_SCRIPTS \
            -- bash -euxo pipefail -c 'cd pr && exec bash ../gate/scripts/sandbox-build.sh'

      - name: Prepare merge-group cache artifact metadata
        id: cache_stage
        if: ${{ github.event_name == 'merge_group' && env.STAGE_LAKE_CACHE == '1' && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s pr/.lake/cache-staging/outputs.jsonl
          TOOLCHAIN="$(cat pr/lean-toolchain)"
          case "$TOOLCHAIN" in
            leanprover/lean4:[A-Za-z0-9]*) ;;
            *) echo "::error::invalid toolchain pin '$TOOLCHAIN'"; exit 1 ;;
          esac
          printf 'toolchain=%s\n' "$TOOLCHAIN" >> "$GITHUB_OUTPUT"
          echo 'staged=true' >> "$GITHUB_OUTPUT"

      - name: Hand the merge-group oleans to the isolated publisher
        if: ${{ steps.cache_stage.outputs.staged == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: lake-cache-staging-${{ steps.pr.outputs.status_sha }}
          path: pr/.lake/cache-staging
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # A replacement normally becomes newly actionable when the pinned Mathlib moves; that bump PR
      # is picked up by Tau Ceti's bump worker. Running the same trusted probe on source PRs also
      # prevents a newly-added shim from targeting API that already exists at the current pin. The
      # probe follows the build so a partial Mathlib download can be recovered by the normal build
      # path first. Only concrete replacements block; broader sentinels remain audit warnings.
      - name: Migrate shims whose exact replacements exist in pinned Mathlib
        id: shim_expiry
        if: ${{ always() && env.INFRA != '1' && env.OUT_OF_SCOPE != '1' && env.SHIM_CHECK == '1' }}
        continue-on-error: true
        run: |
          set +e
          args=(--fail-on-available)
          if [ -n "${BASE_SHIM_REGISTRY:-}" ]; then
            args+=(--base-manifest "$BASE_SHIM_REGISTRY" --base-root "$BASE_SHIM_ROOT")
            [ "${BUMP:-0}" = "1" ] || args+=(--only-new)
          fi
          python3 gate/scripts/check-expired-mathlib-shims.py \
            --repo-root pr --manifest pr/TauCeti/mathlib-shims.json "${args[@]}"
          rc=$?
          echo "SHIM_EXPIRY_RC=$rc" >> "$GITHUB_ENV"
          exit "$rc"

      - name: Report build and bump-guard statuses to the PR head commit
        id: report
        if: always()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Posting the three statuses is deliberately NOT all-or-nothing. These are three
          # sequential API calls under `set -e`: a single transient error on an early one used to
          # abort the step and leave the commit with a partial set. A MISSING required status is
          # worse than a red one. `build` never appears, so GitHub holds the PR at BLOCKED
          # forever; core.derive reads no `build` status, so labels.py pins the PR at
          # `awaiting-CI` (its ci=None branch) rather than `ci-failed`; and nothing re-runs
          # pr-build without a push, so no event ever corrects it. That wedged PR #1358 for seven
          # days, invisible to both the author path and the review path.
          #
          # So: retry each POST, always attempt all three whatever the others did, and surface a
          # persistent failure loudly at the end rather than silently dropping a status.
          # The scope, size and new-file guards above read the pull request's CURRENT state
          # from the API rather than from the immutable head, so it can move underneath a run.
          # Fail closed: an unreadable answer is not a passing one. A status is keyed only by
          # commit, so a green posted while the pull request has moved on can outlive the state
          # it was about -- the same SHA can become the head again, two pull requests can share
          # a head, and retargeting does not change the head at all.
          head_moved=0
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            now=$(gh api "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.num }}" \
                    --jq '[.head.sha, .base.ref] | join(" ")' 2>/dev/null) || now=""
            if [ "$now" != "${{ steps.pr.outputs.sha }} ${{ steps.pr.outputs.base_ref }}" ]; then
              head_moved=1
              echo "::warning::PR is now '${now:-unreadable}', not '${{ steps.pr.outputs.sha }} ${{ steps.pr.outputs.base_ref }}'"
            fi
          fi

          post_fail=0
          post_status() {
            local ctx="$1" st="$2" dsc="$3" attempt
            for attempt in 1 2 3; do
              if gh api -X POST "repos/${{ github.repository }}/statuses/${{ steps.pr.outputs.status_sha }}" \
                   -f state="$st" -f context="$ctx" -f description="$dsc" \
                   -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
                echo "posted $ctx=$st ($dsc) to ${{ steps.pr.outputs.status_sha }}"
                return 0
              fi
              echo "::warning::posting the $ctx status failed (attempt $attempt/3)"
              if [ "$attempt" != 3 ]; then sleep $(( attempt * 5 )); fi
            done
            # Never propagate the failure as a return code: that would abort this step under
            # `set -e` and skip the statuses not yet posted, which is the bug being fixed.
            echo "::error::could not post the $ctx status to ${{ steps.pr.outputs.status_sha }} after 3 attempts"
            post_fail=1
            return 0
          }

          # bump-guard: this job already ran the workflow-pinned scripts/check-bump.sh inline
          # (the "Validate the Lake-pin bump" step), so we post the required `bump-guard`
          # status from its result here rather than from a separate workflow. BUMP_BAD is set
          # only when a manifest/toolchain change failed that validator; anything else (no pin
          # change, or a validated forward bump) is a pass. Posting it from this job also means
          # both required statuses land together, before the auto-merge workflow_run fires.
          if [ "${{ env.BUMP_BAD }}" = "1" ]; then
            bg_state=failure; bg_desc="Lake pin change is not a validated forward bump — needs human review"
          elif [ "${{ env.BUMP }}" = "1" ] && [ "${{ env.BUMP_VALIDATED }}" != "1" ]; then
            # The pins changed and the validator never got to run — the build was abandoned
            # earlier for some unrelated reason. Knowing a bump is present is not knowing it is
            # a safe one, so do not say it is.
            bg_state=failure; bg_desc="Lake pin change was not validated — the build did not get that far; re-run pr-build"
          elif [ "${{ env.PINS_KNOWN }}" != "1" ]; then
            # The pin state could not be established: an unresolved merge base, an unreadable
            # tree entry, or a pin path that is not an ordinary file. Neither "validated" nor
            # "no pin change" is something this run knows, so assert neither. Kept separate from
            # INFRA deliberately, since INFRA is set by several things that say nothing about the
            # pins — a conflict, a moved head — and keying off it would tell a merely conflicting
            # pull request that its pin state was unknown when it is perfectly well known.
            bg_state=failure; bg_desc="could not determine whether the Lake pins changed — re-run pr-build"
          elif [ "${{ env.HUMAN_LAKEFILE }}" = "1" ]; then
            bg_state=success; bg_desc="lakefile is human-owned; pin policy passed, but candidate config was not executed"
          else
            bg_state=success; bg_desc="validated forward Lake pin bump (or no pin change)"
          fi
          post_status bump-guard "$bg_state" "$bg_desc"

          # build: the actionable exact-candidate verdict consumed by the autonomous bump/fix-ci
          # workers. It includes the sandboxed build plus shim metadata and exact-expiry failures,
          # but never a merge-policy verdict. An out-of-scope scripts/.github change still receives
          # a useful build because all harness code is workflow-pinned. A lakefile edit or invalid
          # pin is never executed and therefore reports a required failure rather than pretending
          # that a different configuration built.
          if [ "$head_moved" = 1 ]; then
            state=failure; desc="the pull request changed during this build — the run for its current state statuses it"
          elif [ "${{ env.CONFIG_BAD }}" = "1" ]; then
            state=failure; desc="build not run — candidate Lake configuration failed trusted attestation"
          elif [ "${{ env.BUMP_BAD }}" = "1" ] || [ "${{ env.INFRA }}" = "1" ] \
             || [ "${{ env.TOO_LARGE }}" = "1" ] || [ "${{ env.DIFF_UNKNOWN }}" = "1" ]; then
            state=failure; desc="build not run — see the scope check"
          elif [ "${{ steps.build.outcome }}" = "failure" ]; then
            state=failure; desc="sandboxed build, audit, or simp-NF lint failed"
          elif { [ -n "${{ env.SHIM_COVERAGE_RC }}" ] \
                 && [ "${{ env.SHIM_COVERAGE_RC }}" != "0" ]; } \
               || [ "${{ steps.shim_coverage.outcome }}" = "failure" ]; then
            state=failure; desc="shim expiry metadata invalid — see failed checker step"
          elif [ "${{ env.SHIM_EXPIRY_RC }}" = "3" ]; then
            state=failure; desc="Mathlib replacements landed — autonomous shim migration required"
          elif { [ -n "${{ env.SHIM_EXPIRY_RC }}" ] \
                 && [ "${{ env.SHIM_EXPIRY_RC }}" != "0" ]; } \
               || [ "${{ steps.shim_expiry.outcome }}" = "failure" ]; then
            state=failure; desc="shim expiry probe failed — see failed checker step"
          elif [ "${{ steps.build.outcome }}" = "success" ]; then
            state=success; desc="exact-head sandboxed build and workflow-pinned audits passed"
          else
            state=failure; desc="sandboxed build, audit, or simp-NF lint failed"
          fi
          {
            echo "build-state=$state"
            echo "build-description=$desc"
            if [ "${{ github.event_name }}" = "merge_group" ] && [ "${STAGE_LAKE_CACHE:-}" = "1" ]; then
              echo 'publication-required=true'
            else
              echo 'publication-required=false'
            fi
          } >> "$GITHUB_OUTPUT"
          # PR heads are reported immediately. A merge-group head is reported by the finalizer
          # job below, after its exact revision map has reached the public cache endpoint.
          if [ "${{ github.event_name }}" != "merge_group" ]; then
            post_status build "$state" "$desc"
          fi

          # scope: the merge-policy verdict, posted as its OWN status so a policy issue never hides the
          # build result (the bug this split fixes — an out-of-scope PR used to post its "human review"
          # verdict as a red `build`, so fix-ci churned on it and you could not see whether it compiled).
          # Kept separate from the required GitHub checks so a human-owned infrastructure PR can be
          # merged after review, but required green by TauCetiReview's automatic merge policy. This
          # status is therefore a trusted, fail-closed input to every automatic merge decision.
          if [ "${{ env.SCOPE_OK }}" != "1" ]; then
            sc_state=failure; sc_desc="trusted scope guard did not complete — re-run pr-build"
          elif [ "${{ env.OUT_OF_SCOPE }}" = "1" ]; then
            sc_state=failure; sc_desc="changes outside TauCeti/ — human review + merge required"
          elif [ "${{ env.BUMP_BAD }}" = "1" ]; then
            sc_state=failure; sc_desc="Lake pin change failed the trusted bump validator"
          elif [ "${{ env.INFRA }}" = "1" ]; then
            sc_state=failure; sc_desc="trusted scope/config checks did not complete — see the run; human review may be required"
          elif [ "${{ env.TOO_LARGE }}" = "1" ]; then
            sc_state=failure; sc_desc="diff exceeds 2000 added/removed lines or 2000 files — split into smaller PRs to keep review manageable"
          elif [ "${{ env.DIFF_UNKNOWN }}" = "1" ]; then
            sc_state=failure; sc_desc="could not read PR diff totals from the GitHub API — re-run pr-build"
          elif [ "${{ env.NEWFILE_TOO_LONG }}" = "1" ]; then
            sc_state=failure; sc_desc="a newly added .lean file exceeds 1000 lines — split it (existing files may grow to 1500)"
          else
            sc_state=success; sc_desc="changes are in scope (TauCeti/, the allowed root files, and the bibliography only)"
          fi
          post_status scope "$sc_state" "$sc_desc"

          # A status we could not post leaves the commit in the wedged state described above, so
          # fail the job loudly. This runs only after all three have been attempted.
          if [ "$post_fail" = 1 ]; then
            echo "::error::one or more commit statuses are missing; re-run pr-build for this commit"
            exit 1
          fi
          [ "$state" = "success" ]

  # Only an already-audited merge-group commit may publish. The reusable workflow runs on a
  # fresh runner, sparsely checks out that commit's toolchain pin and key-free confirmation
  # helper, and is the sole holder of the key. The helper runs only after the key-bearing step.
  publish-merge-group-cache:
    needs: sandboxed-build
    if: ${{ always() && needs.sandboxed-build.result == 'success' && needs.sandboxed-build.outputs.publication-required == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-lake-cache.yml
    with:
      revision: ${{ needs.sandboxed-build.outputs.status-sha }}
      artifact-name: lake-cache-staging-${{ needs.sandboxed-build.outputs.status-sha }}
      reported-toolchain: ${{ needs.sandboxed-build.outputs.reported-toolchain }}
      publication-required: true
    secrets:
      LAKE_CACHE_KEY: ${{ secrets.LAKE_CACHE_KEY }}

  # The merge queue's required `build` status is posted only here. In a configured installation,
  # green therefore means both that the combined commit passed every sandboxed audit and that a
  # fresh checkout can fetch its exact output map from the public cache before GitHub lands it.
  finalize-merge-group-build:
    needs: [sandboxed-build, publish-merge-group-cache]
    if: ${{ always() && github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ needs.sandboxed-build.outputs.status-sha }}
      BUILD_JOB_RESULT: ${{ needs.sandboxed-build.result }}
      BUILD_STATE: ${{ needs.sandboxed-build.outputs.build-state }}
      BUILD_DESCRIPTION: ${{ needs.sandboxed-build.outputs.build-description }}
      PUBLICATION_REQUIRED: ${{ needs.sandboxed-build.outputs.publication-required }}
      PUBLISH_JOB_RESULT: ${{ needs.publish-merge-group-cache.result }}
      PUBLISHED: ${{ needs.publish-merge-group-cache.outputs.published }}
    steps:
      - name: Post the terminal merge-group build status
        run: |
          set -uo pipefail
          if [ "$BUILD_JOB_RESULT" != "success" ] || [ "$BUILD_STATE" != "success" ]; then
            state=failure
            description="${BUILD_DESCRIPTION:-sandboxed merge-group build did not complete}"
          elif [ "$PUBLICATION_REQUIRED" = "true" ] \
               && { [ "$PUBLISH_JOB_RESULT" != "success" ] || [ "$PUBLISHED" != "true" ]; }; then
            state=failure
            description="build passed, but its exact Lake cache was not published"
          elif [ "$PUBLICATION_REQUIRED" = "true" ]; then
            state=success
            description="sandboxed build passed; exact revision cache is public"
          else
            state=success
            description="sandboxed build passed (cache upload is not configured)"
          fi

          posted=0
          for attempt in 1 2 3; do
            if gh api -X POST "repos/${{ github.repository }}/statuses/$STATUS_SHA" \
                 -f state="$state" -f context=build -f description="$description" \
                 -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; then
              posted=1
              break
            fi
            echo "::warning::posting the build status failed (attempt $attempt/3)"
            [ "$attempt" = 3 ] || sleep $((attempt * 5))
          done
          [ "$posted" = 1 ] || { echo "::error::could not post the merge-group build status"; exit 1; }
          [ "$state" = success ]
