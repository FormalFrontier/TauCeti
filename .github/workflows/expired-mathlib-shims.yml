name: Check expired Mathlib shims

# Report-only maintenance prompt. The registry names temporary Tau Ceti surfaces and a concrete
# declaration or module expected from Mathlib. Once a target exists in the pinned dependency, the
# workflow emits annotations for migration PRs; it does not fail merely because a shim has expired.

on:
  schedule:
    - cron: "35 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: expired-mathlib-shims
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'TauCetiProject/TauCeti'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Mathlib's compressed download cache
        uses: ./.github/actions/restore-mathlib-ltars
        with:
          project-dir: .

      - name: Set up Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Fetch Mathlib oleans, retrying with a forced full refetch
        run: |
          if ! lake exe cache get; then
            echo "::warning::lake exe cache get failed; forcing a full refetch"
            lake exe cache get!
          fi

      - name: Check the pinned Mathlib for tracked replacements
        run: python3 scripts/check-expired-mathlib-shims.py --report-file "$RUNNER_TEMP/mathlib-shims-report.json"

      - name: Notify the maintenance topic
        env:
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
          ZULIP_EMAIL: ${{ secrets.ZULIP_EMAIL }}
          ZULIP_SITE: https://leanprover.zulipchat.com
          ZULIP_CHANNEL: Tau Ceti
          ZULIP_TOPIC: Mathlib shims
        run: python3 scripts/check-expired-mathlib-shims.py --notify-report "$RUNNER_TEMP/mathlib-shims-report.json"
